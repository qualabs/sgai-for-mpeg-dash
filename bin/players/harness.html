<!doctype html>
<html>
<head><meta charset="utf-8"><title>SGAI legacy-Player harness</title></head>
<body>
<video id="video" muted autoplay playsinline width="640" height="360"></video>
<script>
// The part of the harness every Player shares: the media element and the log.
// What is specific to one Player lives in adapters/<player>.js, which sets
// window.SGAI_ADAPTER = { name, version(), load(video, url, log), inspect() }.
(function () {
  const t0 = performance.now();
  const now = () => Math.round(performance.now() - t0);
  const video = document.getElementById('video');
  const state = { events: [], errors: [], fatal: null, playingAt: null, startPos: null, loadAt: null };
  const log = {
    event(type, data) { state.events.push({ t: now(), type, data: data === undefined ? null : data }); },
    error(code, message, fatal) {
      const e = { t: now(), code: String(code), message: String(message || ''), fatal: !!fatal };
      state.errors.push(e);
      if (fatal && !state.fatal) state.fatal = e;
    },
  };
  for (const ev of ['loadedmetadata', 'canplay', 'playing', 'waiting', 'stalled', 'seeking', 'ended']) {
    video.addEventListener(ev, () => {
      log.event('video:' + ev, { currentTime: video.currentTime });
      if (ev === 'playing' && state.playingAt === null) {
        state.playingAt = now();
        state.startPos = video.currentTime;
      }
    });
  }
  video.addEventListener('error', () => {
    const err = video.error;
    log.error('video:' + (err ? err.code : '?'), err ? err.message : '', true);
  });

  const params = new URLSearchParams(location.search);
  const player = params.get('player');
  const scripts = {
    dashjs: ['/lib/dashjs/dash.all.min.js', '/adapters/dashjs.js'],
    shaka: ['/lib/shaka/shaka-player.compiled.js', '/adapters/shaka.js'],
    // The reference (phase 11): served only by bin/conformance/behaviour.py,
    // which adds the /reference/ prefix in its own process.
    sgai: ['/lib/dashjs/dash.all.min.js', '/reference/profiles.js', '/reference/sgai-reference.js',
           '/adapters/sgai-clock.js', '/adapters/sgai.js'],
  }[player] || [];

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('cannot load ' + src));
      document.head.appendChild(s);
    });
  }

  window.SGAI = {
    ready: (async () => {
      if (!scripts.length) throw new Error('unknown player ' + player);
      for (const s of scripts) await loadScript(s);
      return { name: window.SGAI_ADAPTER.name, version: window.SGAI_ADAPTER.version() };
    })(),
    async load(url) {
      state.loadAt = now();
      try {
        await window.SGAI_ADAPTER.load(video, url, log);
      } catch (e) {
        log.error('load', (e && (e.message || e.code)) || String(e), true);
      }
    },
    state() {
      return {
        t: now(), loadAt: state.loadAt, playingAt: state.playingAt, startPos: state.startPos,
        currentTime: video.currentTime, paused: video.paused, readyState: video.readyState,
        fatal: state.fatal, errors: state.errors.slice(0, 20), errorCount: state.errors.length,
        events: state.events.filter((e) => !e.type.startsWith('video:')).slice(0, 50),
        inspect: window.SGAI_ADAPTER ? window.SGAI_ADAPTER.inspect() : null,
      };
    },
  };
})();
</script>
</body>
</html>
