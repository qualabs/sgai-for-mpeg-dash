# A join after the end of the active interval: R4.8's event is active over [2, 3] s; playback
# starts at 4 s. §5.16.2.2.3: only events with PRT ≤ PHP ≤ EAP or PHP < PRT enter QE, so it
# is never resolved nor executed.
format: sgai-scenario/1
timescale: 1000
tolerance: 250
play_from: 4000
observe_until: 4000
entry: behaviour/fixtures/R4.8/main.mpd
fixtures:
- path: behaviour/fixtures/R4.8/main.mpd
- path: behaviour/fixtures/R4.8/alt.mpd
  url: https://aps.example.com/b/r4-8/break
player_capabilities:
  D1:
    sgai-video-decoders: 2
    sgai-image-over-video: 1
    sgai-html-over-video: 1
    sgai-custom-layout: 0
    sgai-ad-audio: 0
sends_capabilities: []
actions: []
outcomes:
  D1:
    summary: the programme from 4 s, nothing else
    requests: []
    selection: []
    presentation:
    - start: 0
      end: 4000
      layout: none
      shows:
      - element: primary
        from: 4000
    beacons: []
