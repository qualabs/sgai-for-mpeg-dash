missing_carrier:
- requirement: R13.7
  element: 'UC-21: "the resolution document carries a slot-start and a slot-end beacon".
    The slot-start beacon fires again in each execution, and in a late execution when
    A begins. No carrier: the beacons above are the candidates'' own.'
  classes:
  - D1
  - D3
  - D4
- requirement: R34.1
  element: 'UC-21 "Publisher intent" 2: the window declared once-per-session. After
    the first execution consumed it, the rewind leaves the programme uninterrupted
    and fires nothing; a seek over the window does not consume it. @executeOnce is
    defined on the pause window only (PUB-10); an overlay window has no declaration
    for it, so no variant is written.'
  classes:
  - D1
  - D3
  - D4
- requirement: R34.9
  element: 'UC-21 "Publisher intent" 3: the window declares that a late execution
    starts with an offset; the seek to 10:15 then presents B from its 5th second,
    A not at all, and C until 10:30, with the slot-start beacon when B begins. No
    overlay-window declaration carries it, so no variant is written.'
  classes:
  - D1
  - D3
  - D4
disagreements:
- context: 'context/04 UC-21 "Declaring nothing — the seek to 10:15": "A late execution
    (R34.9). The Player presents the sequence from A"; context/03 R34.6: every entry
    of the playhead, "a join or a seek landing inside it", is a new execution that
    "MUST be presented as the first".'
  annex: 'No annex walks UC-21. The specification, §5.1.3 "What the span means": "When
    the playhead enters the span after its start (a join or a seek), the Player MAY
    resolve the window and present for the remainder of the span."'
  recorded: The outcomes follow context/04 (variant seek-to-1015 presents A, then
    B cut at 10:30). A Player that conforms to §5.1.3 by not presenting on a late
    entry would fail that variant. Not resolved here.
