missing_carrier:
- requirement: R48.1
  element: 'UC-20 "Ad response": the candidate''s disclosure information — the programme
    (AdChoices), the icon, the destination URL, the party on whose behalf the ad is
    shown, the label "Ad". The specification defines no per-candidate carrier for
    it, so B.3-1 carries none.'
  classes:
  - D1
  - D3
  - D4
  - D5
- requirement: R48.3
  element: 'UC-20 "Expected behavior": D1 renders the icon over the ad and a click
    opens the URL; D3 and D4 render the icon and a remote button shows the URL; D5
    does not fetch the icon, shows a native "Ad" indicator and a remote button shows
    the URL. None of it can be written as an outcome without the carrier of R48.1:
    no indicator element, no fetch of the icon to assert or forbid.'
  classes:
  - D1
  - D3
  - D4
  - D5
disagreements: []
