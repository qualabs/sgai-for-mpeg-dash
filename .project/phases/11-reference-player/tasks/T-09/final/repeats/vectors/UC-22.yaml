  classes:
  - D1
  - D3
  - D4
disagreements:
- context: 'context/04 UC-22 "The programme returns at 20:20": "The Player resumes
    the same execution: A from its 20th second, then B, until the window ends or the
    cap is reached." (also context/03 R40.4: "When a window with the default relation
    is resumed (R40.9), the Player MUST present the suspended form from where it was
    suspended, then the rest of the sequence".)'
  annex: 'No annex walks UC-22. The specification, §4.5.8 PLY-49 (no relation): "A
    form on screen when an alternative presentation begins ends there, and the window
    presents nothing further. For an alternative presentation that begins within the
    window''s span, "nothing further" holds for the rest of that span, including the
    part of it that follows the end of the alternative presentation".'
  recorded: 'The outcomes follow context/04: A resumes at 60 s of the session and
    B follows to 21:00. Under PLY-49 the D1, D3 and D4 outcomes would show the programme
    alone from 60 s and fire none of A''s later beacons nor any of B''s. Not resolved
    here.'
