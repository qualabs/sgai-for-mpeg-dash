# UC-01 — Slot at start of session (pre-roll), as walked by Annex A.
# Expected behaviour: context/04 UC-01. Documents, ids and times: Annex A
# (A.2 main MPD, A.3 List MPD, A.4 sub-MPDs, A.5 walk-through).
format: sgai-scenario/1
uc: UC-01
uc_sha256: f2038e69eebdf37d5ad230dbc317b7db57a519ce8670264465f9aa027c89477d
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 35000
entry: examples/annex-a/A.2-1.mpd
fixtures:
  - path: examples/annex-a/A.2-1.mpd
  - path: examples/annex-a/A.3-1.mpd
    url: https://aps.example.com/linear/preroll?show=42&ep=7
  - path: examples/annex-a/A.4-1.mpd
    url: https://ads-cdn.example.com/cr/101/cr101.mpd
  - path: examples/annex-a/A.4-2.mpd
    url: https://ads-cdn.example.com/cr/102/cr102.mpd
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D2: {sgai-video-decoders: 2, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D5: {sgai-video-decoders: 1, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []

# Every class observes the same thing (context/04 UC-01: D2..D5 "same as
# D1" / "same as D3"; A.6 "Every class sees the same thing"), so the outcome
# is written once and repeated with YAML anchors.
outcomes:
  D1: &linear
    summary: Two full-screen ads, 15 s and 10 s, then the episode from its first frame.
    requests:
      # A.5 step 1: the insertion event is active at PRT = 0; the Player requests the List MPD.
      - at: 0
        url: https://aps.example.com/linear/preroll?show=42&ep=7
        answered_by: examples/annex-a/A.3-1.mpd
      # A.5 step 3: the first ImportedMPD (earliestResolutionTimeOffset 0) before it plays.
      - at: 0
        url: https://ads-cdn.example.com/cr/101/cr101.mpd
        answered_by: examples/annex-a/A.4-1.mpd
      # A.3 / A.5 step 4: the second may be resolved from 10 s before its
      # PeriodStart (5 s into the first ad), and must be before it plays at 15 s.
      - at: {from: 5000, to: 15000}
        url: https://ads-cdn.example.com/cr/102/cr102.mpd
        answered_by: examples/annex-a/A.4-2.mpd
    selection:
      - opportunity: {fixture: examples/annex-a/A.2-1.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: {fixture: examples/annex-a/A.3-1.mpd, id: ad-101}, option: null, layout: linear}
          - {candidate: {fixture: examples/annex-a/A.3-1.mpd, id: ad-102}, option: null, layout: linear}
    presentation:
      - start: 0
        end: 15000
        layout: linear
        shows: [{element: ad, candidate: {fixture: examples/annex-a/A.3-1.mpd, id: ad-101}, option: null}]
      - start: 15000
        end: 25000
        layout: linear
        shows: [{element: ad, candidate: {fixture: examples/annex-a/A.3-1.mpd, id: ad-102}, option: null}]
      # A.5 step 5: the main presentation resumes at RT = PRTA = 0 (insertion).
      - start: 25000
        end: 35000
        layout: none
        shows: [{element: primary, from: 0}]
    beacons:
      # A.4-1: the quartile schedule of ad 101, on the ad's own timeline from 0.
      - {at: 0, fixture: examples/annex-a/A.4-1.mpd, id: "1", url: "https://t.example.com/imp?cr=101"}
      - {at: 0, fixture: examples/annex-a/A.4-1.mpd, id: "2", url: "https://t.example.com/start?cr=101"}
      - {at: 4750, fixture: examples/annex-a/A.4-1.mpd, id: "3", url: "https://t.example.com/q1?cr=101"}
      - {at: 7500, fixture: examples/annex-a/A.4-1.mpd, id: "4", url: "https://t.example.com/mid?cr=101"}
      - {at: 11250, fixture: examples/annex-a/A.4-1.mpd, id: "5", url: "https://t.example.com/q3?cr=101"}
      - {at: 15000, fixture: examples/annex-a/A.4-1.mpd, id: "6", url: "https://t.example.com/complete?cr=101"}
      # A.4-2: ad 102 starts at 15 s of the session.
      - {at: 15000, fixture: examples/annex-a/A.4-2.mpd, id: "11", url: "https://t.example.com/imp?cr=102"}
      - {at: 20000, fixture: examples/annex-a/A.4-2.mpd, id: "12", url: "https://t.example.com/mid?cr=102"}
      - {at: 25000, fixture: examples/annex-a/A.4-2.mpd, id: "13", url: "https://t.example.com/complete?cr=102"}
  D2: *linear
  D3: *linear
  D4: *linear
  D5: *linear

missing_carrier: []

disagreements:
  - context: >-
      context/04 UC-01 #### D1: "The extra decoder and overlay surfaces are not
      exercised here because the slot is linear-only."
    annex: >-
      A.6, row D1, D2: "the second decoder may pre-buffer ad 102 during ad 101."
    recorded: >-
      Not resolved here. Pre-buffering is not observable in this vector's
      outcome (no media-segment requests are recorded, and the request for
      cr102.mpd has the same window either way), so the outcomes hold under
      both readings.
