# UC-12 — Overlapping same-family windows with fallback, as walked by
# Annex L.
# Expected behaviour: context/04 UC-12. Documents, ids and times: Annex L
# (L.2 main MPD, L.3 order of the chain, L.4 the empty document and paths
# 1-3, L.5 the fallback window's document and sub-MPD, L.6 options per
# class, L.7 path 4, L.8 classes). Candidates and options carry no @id, so
# they are named by document order.
#
# Playback starts at 19:00 (play_from 1140000), so both windows open at
# 60 s of the session. The main run is path 1; paths 2 and 4 are variants.
# The same APS URL answers a different document per run: what the harness
# serves in a run is each request's `answered_by`, not `fixtures[].url`
# (which names one URL per document).
#
# Not written, because this format or the annex cannot carry it:
# - Path 3 (APS A times out, APS B answers 503): a request has to be
#   answered by a fixture; a transport failure or a non-200 status has no
#   field.
# - Path 4 on D1 and D2 (they present window 1's video lower-third): L.7-1
#   points to https://cdn-a.example.com/cr/0917/lt.mpd and Annex L has no
#   such sub-MPD, so that request has no fixture and the ad's duration
#   (when the presentation returns to the film) is not stated anywhere.
format: sgai-scenario/1
uc: UC-12
uc_sha256: f27d487a9eca608818583f7a447cb895096b3b0f65998061e290f317c8826906
timescale: 1000
tolerance: 250
play_from: 1140000
observe_until: 90000
entry: examples/annex-l/L.2-1.mpd
fixtures:
  - path: examples/annex-l/L.2-1.mpd
  - path: examples/annex-l/L.4-1.xml
    url: https://aps-a.example.com/nl/overlay?f=31
  - path: examples/annex-l/L.5-1.xml
    url: https://aps-b.example.net/sgai/ov?f=31
  - path: examples/annex-l/L.5-2.mpd
    url: https://cdn-b.example.net/cr/1201/corner.mpd
  - path: examples/annex-l/L.7-1.xml
    url: https://aps-a.example.com/nl/overlay?f=31
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D2: {sgai-video-decoders: 2, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D5: {sgai-video-decoders: 1, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
# Annex L has no request fixture; each request forwards its own window's
# @allowedLayouts (PLY-15).
sends_capabilities: []
actions: []

outcomes:
  # Path 1 (L.4): APS A answers the empty document, a failed execution; the
  # Player attempts window 2 and APS B's document is presented per L.6.
  D1: &video_corner
    summary: >-
      Window 1 answers with no candidates; window 2's video corner is shown
      for 20 s from 20:00.
    requests:
      - &req_a_empty
        # L.3: event 1 first, both start at 20:00.
        at: {from: 0, to: 60000}
        url: https://aps-a.example.com/nl/overlay?f=31
        query: {sgai-allowed-layouts: overlay-lower-third}
        answered_by: examples/annex-l/L.4-1.xml
      - &req_b
        at: {from: 0, to: 60000}
        url: https://aps-b.example.net/sgai/ov?f=31
        query: {sgai-allowed-layouts: overlay-corner squeezeback-l-shape-upper-left}
        answered_by: examples/annex-l/L.5-1.xml
      - &sub_corner
        at: {from: 0, to: 60000}
        url: https://cdn-b.example.net/cr/1201/corner.mpd
        answered_by: examples/annex-l/L.5-2.mpd
    selection:
      - &w1_declined
        opportunity: &w1 {fixture: examples/annex-l/L.2-1.mpd, event_id: "1"}
        result: declined
        presented: []
      - opportunity: &w2 {fixture: examples/annex-l/L.2-1.mpd, event_id: "2"}
        result: presented
        presented:
          - {candidate: &c1201 {fixture: examples/annex-l/L.5-1.xml, index: 1}, option: {index: 1}, layout: overlay-corner}
    presentation:
      - &before {start: 0, end: 60000, layout: none, shows: [{element: primary, from: 1140000}]}
      - start: 60000
        end: 80000
        layout: overlay-corner
        shows: [{element: primary, from: 1200000}, {element: ad, candidate: *c1201, option: {index: 1}}]
        note: window 2's cap is 20000 (L.6)
      - &after {start: 80000, end: 90000, layout: none, shows: [{element: primary, from: 1220000}]}
    beacons: &b1201
      - {at: 60000, fixture: examples/annex-l/L.5-1.xml, candidate: *c1201, id: "1", url: "https://t.example.net/imp?cr=1201"}
      - {at: 80000, fixture: examples/annex-l/L.5-1.xml, candidate: *c1201, id: "2", url: "https://t.example.net/complete?cr=1201"}
  D2: *video_corner
  D3: &lshape
    summary: >-
      Window 1 answers with no candidates; window 2's option 1 fails (one
      decoder) and its image L-shape is shown for 20 s from 20:00.
    requests: [*req_a_empty, *req_b]
    selection:
      - *w1_declined
      - &w2_lshape
        opportunity: *w2
        result: presented
        presented:
          - {candidate: *c1201, option: {index: 2}, layout: squeezeback-l-shape-upper-left}
    presentation:
      - *before
      - &p_lshape
        start: 60000
        end: 80000
        layout: squeezeback-l-shape-upper-left
        shows: [{element: primary, from: 1200000, region: upper-left}, {element: ad, candidate: *c1201, option: {index: 2}, region: full frame}]
      - *after
    beacons: *b1201
  D4: *lshape
  D5: &nothing
    summary: Window 1 answers with no candidates; window 2's options all fail on D5; the film plays uninterrupted.
    requests: [*req_a_empty, *req_b]
    selection:
      - *w1_declined
      - &w2_declined {opportunity: *w2, result: declined, presented: []}
    presentation:
      - &film {start: 0, end: 90000, layout: none, shows: [{element: primary, from: 1140000}]}
    beacons: []

variants:
  - id: path-2-both-empty
    description: >-
      L.4 path 2: "both answer with the empty document. Both attempts failed;
      the chain is exhausted, and the film continues uninterrupted." Device
      class plays no part.
    actions: []
    outcomes:
      D1: &both_empty
        summary: Both windows answer with no candidates; the film plays uninterrupted.
        requests:
          - *req_a_empty
          - at: {from: 0, to: 60000}
            url: https://aps-b.example.net/sgai/ov?f=31
            query: {sgai-allowed-layouts: overlay-corner squeezeback-l-shape-upper-left}
            answered_by: examples/annex-l/L.4-1.xml
        selection: [*w1_declined, *w2_declined]
        presentation: [*film]
        beacons: []
      D2: *both_empty
      D3: *both_empty
      D4: *both_empty
      D5: *both_empty
  - id: path-4-video-only-first
    description: >-
      L.7 path 4: APS A answers a document whose only candidate is a video
      lower-third. D3 and D4 cannot render it, so the attempt is a failed
      execution and window 2 is bound as L.6 shows; D5 renders neither. D1
      and D2 present window 1's video lower-third, and are not written: its
      sub-MPD has no fixture in Annex L (see the header).
    actions: []
    outcomes:
      D3: &p4_lshape
        summary: >-
          Window 1's only candidate is a video lower-third D3 / D4 cannot
          render; window 2's image L-shape is shown for 20 s from 20:00.
        requests:
          - &req_a_video
            at: {from: 0, to: 60000}
            url: https://aps-a.example.com/nl/overlay?f=31
            query: {sgai-allowed-layouts: overlay-lower-third}
            answered_by: examples/annex-l/L.7-1.xml
          - *req_b
        selection: [*w1_declined, *w2_lshape]
        presentation: [*before, *p_lshape, *after]
        beacons: *b1201
      D4: *p4_lshape
      D5:
        summary: Neither window's candidate renders on D5; both attempts fail and the film continues.
        requests: [*req_a_video, *req_b]
        selection: [*w1_declined, *w2_declined]
        presentation: [*film]
        beacons: []

missing_carrier: []

disagreements: []
