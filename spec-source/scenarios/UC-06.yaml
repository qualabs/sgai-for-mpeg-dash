# UC-06 — Multi-ad break, as walked by Annex F.
# Expected behaviour: context/04 UC-06. Documents, ids and times: Annex F
# (F.2 main MPD, F.3 List MPD, F.4 sub-MPDs, F.5 the arithmetic, F.6
# walk-through). Playback starts at 1160 s, so session time t is programme
# time 1160 s + t until the insertion at session 40 s stops the programme's
# timeline. The outcomes follow F.5's mandatory policy (trim during play);
# its permitted alternative (drop 604 before play, PLY-35) is a Player choice
# with the same actions, so it cannot be a variant of this vector.
format: sgai-scenario/1
uc: UC-06
uc_sha256: f0d573d224babcc7cd0e4c7dd65959490d446453d9260a8c0bb3e6d2f16834b4
timescale: 1000
tolerance: 250
play_from: 1160000
observe_until: 110000
entry: examples/annex-f/F.2-1.mpd
fixtures:
  - path: examples/annex-f/F.2-1.mpd
  - path: examples/annex-f/F.3-1.mpd
    url: https://aps.example.com/linear/pod?d=5&b=1
  - path: examples/annex-f/F.4-1.mpd
    url: https://ads-cdn.example.com/cr/601/cr601.mpd
  - path: examples/annex-f/F.4-2.mpd
    url: https://ads-cdn.example.com/cr/602/cr602.mpd
  - path: examples/annex-f/F.4-3.mpd
    url: https://ads-cdn.example.com/cr/603/cr603.mpd
  - path: examples/annex-f/F.4-4.mpd
    url: https://ads-cdn.example.com/cr/604/cr604.mpd
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D2: {sgai-video-decoders: 2, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D5: {sgai-video-decoders: 1, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []

# Every class observes the same thing (context/04 UC-06: D2 "same as D1",
# D3..D5 "What the user sees: same as D1"; F.7 "The viewer sees the same break
# on every class").
outcomes:
  D1: &pod
    summary: Ads 601, 602 and 603 in full, then 604 cut at 10 s by the 60 s cap; the programme resumes at 1200 s.
    requests:
      # F.6 step 1: from 1170 s, before the insertion at 1200 s.
      - at: {from: 10000, to: 40000}
        url: https://aps.example.com/linear/pod?d=5&b=1
        answered_by: examples/annex-f/F.3-1.mpd
      # F.3: each ImportedMPD from its earliestResolutionTimeOffset before its
      # PeriodStart (0, 15, 35, 50 s into the break), and before it plays.
      - at: {from: 10000, to: 40000}
        url: https://ads-cdn.example.com/cr/601/cr601.mpd
        answered_by: examples/annex-f/F.4-1.mpd
      - at: {from: 40000, to: 55000}
        url: https://ads-cdn.example.com/cr/602/cr602.mpd
        answered_by: examples/annex-f/F.4-2.mpd
      - at: {from: 60000, to: 75000}
        url: https://ads-cdn.example.com/cr/603/cr603.mpd
        answered_by: examples/annex-f/F.4-3.mpd
      - at: {from: 75000, to: 90000}
        url: https://ads-cdn.example.com/cr/604/cr604.mpd
        answered_by: examples/annex-f/F.4-4.mpd
    selection:
      - opportunity: {fixture: examples/annex-f/F.2-1.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: {fixture: examples/annex-f/F.3-1.mpd, id: ad-601}, option: null, layout: linear}
          - {candidate: {fixture: examples/annex-f/F.3-1.mpd, id: ad-602}, option: null, layout: linear}
          - {candidate: {fixture: examples/annex-f/F.3-1.mpd, id: ad-603}, option: null, layout: linear}
          - {candidate: {fixture: examples/annex-f/F.3-1.mpd, id: ad-604}, option: null, layout: linear}
    presentation:
      - {start: 0, end: 40000, layout: none, shows: [{element: primary, from: 1160000}]}
      # F.5: running sums 15000, 35000, 50000; the cap 60000 cuts 604 at 10 s.
      - {start: 40000, end: 55000, layout: linear, shows: [{element: ad, candidate: {fixture: examples/annex-f/F.3-1.mpd, id: ad-601}, option: null}]}
      - {start: 55000, end: 75000, layout: linear, shows: [{element: ad, candidate: {fixture: examples/annex-f/F.3-1.mpd, id: ad-602}, option: null}]}
      - {start: 75000, end: 90000, layout: linear, shows: [{element: ad, candidate: {fixture: examples/annex-f/F.3-1.mpd, id: ad-603}, option: null}]}
      - {start: 90000, end: 100000, layout: linear, shows: [{element: ad, candidate: {fixture: examples/annex-f/F.3-1.mpd, id: ad-604}, option: null}], note: cut at the cap}
      # F.6 step 5: RT = PRTA = 1200 s.
      - {start: 100000, end: 110000, layout: none, shows: [{element: primary, from: 1200000}]}
    beacons:
      - {at: 40000, fixture: examples/annex-f/F.4-1.mpd, id: "1", url: "https://t.example.com/imp?cr=601"}
      - {at: 55000, fixture: examples/annex-f/F.4-1.mpd, id: "2", url: "https://t.example.com/complete?cr=601"}
      - {at: 55000, fixture: examples/annex-f/F.4-2.mpd, id: "11", url: "https://t.example.com/imp?cr=602"}
      - {at: 65000, fixture: examples/annex-f/F.4-2.mpd, id: "12", url: "https://t.example.com/mid?cr=602"}
      - {at: 75000, fixture: examples/annex-f/F.4-2.mpd, id: "13", url: "https://t.example.com/complete?cr=602"}
      - {at: 75000, fixture: examples/annex-f/F.4-3.mpd, id: "21", url: "https://t.example.com/imp?cr=603"}
      - {at: 90000, fixture: examples/annex-f/F.4-3.mpd, id: "22", url: "https://t.example.com/complete?cr=603"}
      # F.5: "the beacons of 604 at 0 and 7.5 s fire, and the one at 15 s does not".
      - {at: 90000, fixture: examples/annex-f/F.4-4.mpd, id: "31", url: "https://t.example.com/imp?cr=604"}
      - {at: 97500, fixture: examples/annex-f/F.4-4.mpd, id: "32", url: "https://t.example.com/mid?cr=604"}
  D2: *pod
  D3: *pod
  D4: *pod
  D5: *pod

missing_carrier:
  - requirement: R13.7
    element: >-
      UC-06 "Slot beacons": the resolution document carries a slot-start
      beacon, fired once when the first rendered ad begins, and a slot-end
      beacon, fired once when the break ends (after the last ad or at the
      cap). F.3 carries neither.
    classes: [D1, D2, D3, D4, D5]

disagreements:
  - context: >-
      context/04 UC-06 #### D1: "when the cumulative sequence duration reaches
      the break cap, the Player stops, even if the in-progress ad has not
      finished"; Notes: "Alternative overflow policies (skip the break
      entirely, trim-clean to the previous ad boundary, fail-closed) are not
      the default and would have to be opt-in policies declared by the
      Publisher on the slot — out of scope".
    annex: >-
      F.5: "Drop before play, permitted (PLY-35) | 601, 602, 603; 604 dropped
      on its declared duration | 50 s" — a Player policy, with nothing
      declared by the Publisher in F.2.
    recorded: >-
      The outcomes follow the row both agree on (trim during play: 604 cut at
      the cap, 60 s). Under the annex's permitted policy a conforming Player
      would end the break at session 90 s with no beacon of 604. Not resolved
      here.
