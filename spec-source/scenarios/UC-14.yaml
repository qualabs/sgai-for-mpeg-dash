# UC-14 — A non-linear ad over a replacement that is not advertising, as
# walked by Annex N.
# Expected behaviour: context/04 UC-14. Documents, ids and times: Annex N
# (N.2 main MPD, N.3 the two resolutions, N.4 the slate's MPD, N.6 the walk
# per device class, N.7 timing). The candidate carries no @id, so it is
# named by document order.
#
# Timing, from the documents: the channel's AST is 19:00:00Z, so its event
# 31 at 45:00 is at 19:45:00Z; the slate's AST is 19:44:00Z and the slate
# "always starts at the live edge" (N.4), which at 19:45:00Z is slate time
# 60 s — the overlay window's start (slate Event 1, presentationTime 60000).
# So, on a harness whose wall clock follows the channel's, the window opens
# as the slate begins. N.4's "Its overlay window opens one minute into the
# slate" and N.7's "slate 1:00" are slate-timeline instants; read as one
# minute of elapsed slate they would put the overlay 60 s later. This is
# reported as a finding of the annex, not resolved here. The tolerance is
# one segment (2 s), because the slate and the channel are both live and
# their live-edge latencies need not be equal.
#
# Playback starts at the channel's live edge at its publishTime (44:00).
# The MPD refreshes of both dynamic MPDs (minimumUpdatePeriod) re-fetch the
# same fixtures and are not recorded. The slate ends when the Publisher ends
# it (N.7), which no document says; observation ends while it still runs.
#
# The format has no element for the slate: it is neither the primary
# content (no main presentation time is shown) nor an ad candidate. While
# it is on screen the segment's layout is `none` and `shows` lists no
# element besides the overlay; the note says what is there.
format: sgai-scenario/1
uc: UC-14
uc_sha256: f4bcb575e0b91bd3ba1a04e73015f51007ba32f155f80861f7fdbf0a3c52628f
timescale: 1000
tolerance: 2000
play_from: 2640000
observe_until: 90000
entry: examples/annex-n/N.2-1.mpd
fixtures:
  - path: examples/annex-n/N.2-1.mpd
  - path: examples/annex-n/N.4-1.mpd
    url: https://slate.example.com/sports2/blackout-31.mpd
  - path: examples/annex-n/N.3-1.http
  - path: examples/annex-n/N.3-2.xml
    url: https://aps.example.com/nl/overlay?ch=sports2&ctx=blackout
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D2: {sgai-video-decoders: 2, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D5: {sgai-video-decoders: 1, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  legacy: {predates_spec: true}
# N.3-1 carries the forwarded layouts only.
sends_capabilities: []
actions: []

outcomes:
  D1:
    summary: The channel until 45:00, then the blackout slate; the HTML lower-third over the slate for 20 s, then the slate alone.
    requests:
      # N.2: earliestResolutionTimeOffset 30 s before 45:00; resolved by the
      # time the replacement executes.
      - &slate
        at: {from: 30000, to: 60000}
        url: https://slate.example.com/sports2/blackout-31.mpd
        answered_by: examples/annex-n/N.4-1.mpd
      # The slate's window resolves through the APS once the slate MPD is
      # known, before the window opens.
      - &resolve
        at: {from: 30000, to: 60000}
        url: https://aps.example.com/nl/overlay?ch=sports2&ctx=blackout
        query: {sgai-allowed-layouts: overlay-lower-third overlay-corner}
        answered_by: examples/annex-n/N.3-2.xml
        matches: examples/annex-n/N.3-1.http
    selection:
      - opportunity: &opp {fixture: examples/annex-n/N.4-1.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &c1 {fixture: examples/annex-n/N.3-2.xml, index: 1}, option: {index: 1}, layout: overlay-lower-third}
    presentation:
      - &channel {start: 0, end: 60000, layout: none, shows: [{element: primary, from: 2640000}]}
      - start: 60000
        end: 80000
        layout: overlay-lower-third
        shows: [{element: ad, candidate: *c1, option: {index: 1}}]
        note: the HTML lower-third composited over the blackout slate (N.4-1), not over the channel
      - &slate_alone {start: 80000, end: 90000, layout: none, shows: [], note: the blackout slate (N.4-1) alone; the channel is not output}
    beacons: &all_beacons
      - {at: 60000, fixture: examples/annex-n/N.3-2.xml, candidate: *c1, id: "1", url: "https://t.example.com/imp?cr=1401"}
      - {at: 80000, fixture: examples/annex-n/N.3-2.xml, candidate: *c1, id: "2", url: "https://t.example.com/complete?cr=1401"}
  D2:
    summary: The channel until 45:00, then the slate alone; both options are non-video surfaces, so the overlay is declined.
    requests: [*slate, *resolve]
    selection:
      - opportunity: *opp
        result: declined
        presented: []
    presentation: &no_overlay
      - *channel
      - {start: 60000, end: 90000, layout: none, shows: [], note: the blackout slate (N.4-1) alone; the channel is not output}
    beacons: []
  D3:
    summary: As D1 — the HTML lower-third over the slate for 20 s.
    requests: [*slate, *resolve]
    selection:
      - opportunity: *opp
        result: presented
        presented:
          - {candidate: *c1, option: {index: 1}, layout: overlay-lower-third}
    presentation:
      - *channel
      - start: 60000
        end: 80000
        layout: overlay-lower-third
        shows: [{element: ad, candidate: *c1, option: {index: 1}}]
        note: the HTML lower-third composited over the blackout slate (N.4-1)
      - *slate_alone
    beacons: *all_beacons
  D4:
    summary: The HTML option fails; the image lower-third over the slate for 20 s.
    requests: [*slate, *resolve]
    selection:
      - opportunity: *opp
        result: presented
        presented:
          - {candidate: *c1, option: {index: 2}, layout: overlay-lower-third}
    presentation:
      - *channel
      - start: 60000
        end: 80000
        layout: overlay-lower-third
        shows: [{element: ad, candidate: *c1, option: {index: 2}}]
        note: the image lower-third composited over the blackout slate (N.4-1)
      - *slate_alone
    beacons: *all_beacons
  D5:
    summary: The channel until 45:00, then the slate alone; no overlay capability, the overlay is declined.
    requests: [*slate, *resolve]
    selection:
      - opportunity: *opp
        result: declined
        presented: []
    presentation: *no_overlay
    beacons: []
  legacy:
    summary: Plays the slate and ignores the window it does not recognise; the blackout holds and no ad is shown.
    requests: [*slate]
    selection:
      - opportunity: *opp
        result: ignored
        presented: []
    presentation: *no_overlay
    beacons: []

missing_carrier: []

disagreements:
  - context: >-
      context/04 UC-14 "A window on the primary timeline over the same span",
      Declaring nothing: "a form already on screen when the slate begins is
      suspended, and resumes when the slate ends if the window is still open
      (R40.4)."
    annex: >-
      N.7: "with no relation, a Player of this specification presents it only
      over the channel; a form on screen at 45:00 ends there, and the window
      presents nothing over the slate (PLY-49)".
    recorded: >-
      Not resolved here. The case has no documents in Annex N (no window on
      the primary timeline in N.2-1), so no outcome or variant is written for
      it, and the outcomes above hold under both readings.
