# UC-08 — Overlay window crosses a pause-ad window, as walked by Annex H.
# Expected behaviour: context/04 UC-08. Documents, ids and times: Annex H
# (H.2 main MPD, H.3 requests, H.4 overlay document, H.5 pause document,
# H.6 sub-MPDs, H.7 walk-through Branch A, H.9 classes). Candidates and
# options carry no @id in H.4 / H.5, so they are named by document order.
#
# Playback starts at 4:40 (play_from 280000), inside the overlay window's
# resolution window (from 4:00, H.3), so the session clock is H.7's wall
# clock plus 20 s: overlay at 20 s, pause at 30 s, resume at 70 s, end of
# the overlay at 90 s.
#
# Branch B (H.8) is a live channel with a time-shift buffer; it has no
# documents of its own (H.2-1 is static), so it is not a variant here.
format: sgai-scenario/1
uc: UC-08
uc_sha256: ff248c83bd49122921de658ac002ceeced20fe51604f60cf884279ef8a5233b3
timescale: 1000
tolerance: 250
play_from: 280000
observe_until: 100000
entry: examples/annex-h/H.2-1.mpd
fixtures:
  - path: examples/annex-h/H.2-1.mpd
  - path: examples/annex-h/H.3-1.http
  - path: examples/annex-h/H.4-1.xml
    url: https://aps.example.com/nl/overlay?t=film20&w=1
  - path: examples/annex-h/H.5-1.xml
    url: https://aps.example.com/nl/pause?t=film20
  - path: examples/annex-h/H.6-1.mpd
    url: https://ads-cdn.example.com/nl/801/cr801v.mpd
  - path: examples/annex-h/H.6-2.mpd
    url: https://ads-cdn.example.com/pz/802/cr802v.mpd
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D2: {sgai-video-decoders: 2, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D5: {sgai-video-decoders: 1, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
# H.3 sends only the forwarded layouts.
sends_capabilities: []
# H.1 / H.7: the viewer pauses at 5:10 and resumes 40 s later.
actions:
  - {at: 30000, do: pause}
  - {at: 70000, do: resume}

outcomes:
  D1:
    summary: >-
      Video lower-third from 5:00; at the pause it is suspended and the video
      pause ad plays fullscreen for 30 s, then the paused frame; on resume the
      lower-third comes back with its remaining 20 s.
    requests:
      - &req_overlay
        # H.3: the overlay window is resolved before 5:00 (from 4:00).
        at: {from: 0, to: 20000}
        url: https://aps.example.com/nl/overlay?t=film20&w=1
        query: {sgai-allowed-layouts: overlay-lower-third}
        answered_by: examples/annex-h/H.4-1.xml
        matches: examples/annex-h/H.3-1.http
      - &sub801
        at: {from: 0, to: 20000}
        url: https://ads-cdn.example.com/nl/801/cr801v.mpd
        answered_by: examples/annex-h/H.6-1.mpd
      - &req_pause
        # H.3: "this Player resolves at the pause instead, at 5:10". The
        # second request of H.3-1.http; `matches` compares only a file's first
        # request, so it is not set here.
        at: 30000
        url: https://aps.example.com/nl/pause?t=film20
        query: {sgai-allowed-layouts: pause-fullscreen pause-partial}
        answered_by: examples/annex-h/H.5-1.xml
      - &sub802
        at: 30000
        url: https://ads-cdn.example.com/pz/802/cr802v.mpd
        answered_by: examples/annex-h/H.6-2.mpd
    selection:
      - opportunity: &opp_overlay {fixture: examples/annex-h/H.2-1.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &c801 {fixture: examples/annex-h/H.4-1.xml, index: 1}, option: {index: 1}, layout: overlay-lower-third}
      # Both EventStreams of H.2-1 use Event@id 1; the pause window is the
      # second one, which this reference cannot tell apart from the first.
      - opportunity: &opp_pause {fixture: examples/annex-h/H.2-1.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &c802 {fixture: examples/annex-h/H.5-1.xml, index: 1}, option: {index: 1}, layout: pause-fullscreen}
    presentation:
      - &before {start: 0, end: 20000, layout: none, shows: [{element: primary, from: 280000}]}
      - start: 20000
        end: 30000
        layout: overlay-lower-third
        shows: [{element: primary, from: 300000}, {element: ad, candidate: *c801, option: {index: 1}}]
      - start: 30000
        end: 60000
        layout: pause-fullscreen
        shows: [{element: ad, candidate: *c802, option: {index: 1}}]
        note: H.7 "The pause ad plays"; the overlay is suspended with 10000 ms of its cap accrued
      - &held
        start: 60000
        end: 70000
        layout: none
        shows: [{element: primary, from: 310000}]
        note: H.7 "onExhausted="stop" leaves the paused frame"; playback still paused
      - start: 70000
        end: 90000
        layout: overlay-lower-third
        shows: [{element: primary, from: 310000}, {element: ad, candidate: *c801, option: {index: 1}}]
        note: H.7 "the overlay is restored where it was suspended"
      - &after {start: 90000, end: 100000, layout: none, shows: [{element: primary, from: 330000}]}
    beacons: &all_beacons
      # H.4 / H.5 tracking; 801's on its presented time (10 s before the
      # pause, 20 s after the resume), 802's from the pause.
      - {at: 20000, fixture: examples/annex-h/H.4-1.xml, candidate: *c801, id: "1", url: "https://t.example.com/imp?cr=801"}
      - {at: 30000, fixture: examples/annex-h/H.5-1.xml, candidate: *c802, id: "1", url: "https://t.example.com/imp?cr=802"}
      - {at: 60000, fixture: examples/annex-h/H.5-1.xml, candidate: *c802, id: "2", url: "https://t.example.com/complete?cr=802"}
      - {at: 85000, fixture: examples/annex-h/H.4-1.xml, candidate: *c801, id: "2", url: "https://t.example.com/mid?cr=801"}
      - {at: 90000, fixture: examples/annex-h/H.4-1.xml, candidate: *c801, id: "3", url: "https://t.example.com/complete?cr=801"}
  D2:
    summary: >-
      Video lower-third on the second decoder; at the pause it is suspended
      and the video pause ad plays on the second decoder over the held frame;
      on resume the lower-third comes back.
    requests: [*req_overlay, *sub801, *req_pause, *sub802]
    selection:
      - opportunity: *opp_overlay
        result: presented
        presented:
          - {candidate: *c801, option: {index: 1}, layout: overlay-lower-third}
      - opportunity: *opp_pause
        result: presented
        presented:
          - {candidate: *c802, option: {index: 1}, layout: pause-fullscreen}
    presentation:
      - *before
      - start: 20000
        end: 30000
        layout: overlay-lower-third
        shows: [{element: primary, from: 300000}, {element: ad, candidate: *c801, option: {index: 1}}]
      - start: 30000
        end: 60000
        layout: pause-fullscreen
        shows: [{element: ad, candidate: *c802, option: {index: 1}}]
        note: H.9 "video pause ad on the second decoder over the held frame"
      - *held
      - start: 70000
        end: 90000
        layout: overlay-lower-third
        shows: [{element: primary, from: 310000}, {element: ad, candidate: *c801, option: {index: 1}}]
      - *after
    beacons: *all_beacons
  D3:
    summary: >-
      HTML lower-third; at the pause it is suspended and the HTML partial pause
      ad is shown over the paused frame for 30 s; on resume the lower-third
      comes back.
    requests: [*req_overlay, *req_pause]
    selection:
      - opportunity: *opp_overlay
        result: presented
        presented:
          - {candidate: *c801, option: {index: 2}, layout: overlay-lower-third}
      - opportunity: *opp_pause
        result: presented
        presented:
          - {candidate: *c802, option: {index: 2}, layout: pause-partial}
    presentation:
      - *before
      - start: 20000
        end: 30000
        layout: overlay-lower-third
        shows: [{element: primary, from: 300000}, {element: ad, candidate: *c801, option: {index: 2}}]
      - start: 30000
        end: 60000
        layout: pause-partial
        shows: [{element: primary, from: 310000, region: paused frame}, {element: ad, candidate: *c802, option: {index: 2}}]
      - *held
      - start: 70000
        end: 90000
        layout: overlay-lower-third
        shows: [{element: primary, from: 310000}, {element: ad, candidate: *c801, option: {index: 2}}]
      - *after
    beacons: *all_beacons
  D4:
    summary: >-
      Image lower-third; at the pause it is suspended and the image partial
      pause ad is shown over the paused frame for 30 s; on resume the
      lower-third comes back.
    requests: [*req_overlay, *req_pause]
    selection:
      - opportunity: *opp_overlay
        result: presented
        presented:
          - {candidate: *c801, option: {index: 3}, layout: overlay-lower-third}
      - opportunity: *opp_pause
        result: presented
        presented:
          - {candidate: *c802, option: {index: 3}, layout: pause-partial}
    presentation:
      - *before
      - start: 20000
        end: 30000
        layout: overlay-lower-third
        shows: [{element: primary, from: 300000}, {element: ad, candidate: *c801, option: {index: 3}}]
      - start: 30000
        end: 60000
        layout: pause-partial
        shows: [{element: primary, from: 310000, region: paused frame}, {element: ad, candidate: *c802, option: {index: 3}}]
      - *held
      - start: 70000
        end: 90000
        layout: overlay-lower-third
        shows: [{element: primary, from: 310000}, {element: ad, candidate: *c801, option: {index: 3}}]
      - *after
    beacons: *all_beacons
  D5:
    summary: Nothing; both opportunities are declined, the paused frame stays clean and the film continues on resume.
    requests: [*req_overlay, *req_pause]
    selection:
      - opportunity: *opp_overlay
        result: declined
        presented: []
      - opportunity: *opp_pause
        result: declined
        presented: []
    presentation:
      - {start: 0, end: 30000, layout: none, shows: [{element: primary, from: 280000}]}
      - {start: 30000, end: 70000, layout: none, shows: [{element: primary, from: 310000}], note: paused frame}
      - {start: 70000, end: 100000, layout: none, shows: [{element: primary, from: 310000}]}
    beacons: []

missing_carrier: []

disagreements: []
