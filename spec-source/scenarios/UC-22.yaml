# UC-22 — A linear mid-roll inside an overlay window, with no relation declared.
# No annex: the documents are fixtures/UC-22/ (a VOD programme with an
# overlay window at 20:00-21:00, cap 60 s, no @linearRelation, and an
# InsertPresentation at 20:20; the window's resolution document with two
# image candidates of 30 s, A and B). The insertion resolves to Annex B's
# List MPD and sub-MPD unchanged (one 30 s ad, B.3-1 and B.4-1), served at
# this MPD's insertion URL. Expected behaviour: context/04 UC-22.
#
# Not written: the UC's "A replacement instead of an insertion" needs another
# main MPD (a ReplacePresentation at 20:20), and a variant cannot change the
# entry. The slot-start beacon (R13.7) has no carrier.
format: sgai-scenario/1
uc: UC-22
uc_sha256: 35792775a2b75d549c0d331c2f6dc9a1598ebf84fcf2da89e897fd9fc325bfca
timescale: 1000
tolerance: 250
# Playback starts at 19:50.
play_from: 1190000
observe_until: 110000
entry: scenarios/fixtures/UC-22/main.mpd
fixtures:
  - path: scenarios/fixtures/UC-22/main.mpd
    class: publisher-mpd
  - path: scenarios/fixtures/UC-22/overlay-list.xml
    url: https://aps.example.com/nl/overlay?s=22&e=5&w=1
    class: overlay-list
  - path: examples/annex-b/B.3-1.mpd
    url: https://aps.example.com/linear/midroll?s=22&e=5&b=1
  - path: examples/annex-b/B.4-1.mpd
    url: https://ads-cdn.example.com/cr/201/cr201.mpd
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D2: {sgai-video-decoders: 2, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D5: {sgai-video-decoders: 1, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  legacy: {predates_spec: true, sgai-video-decoders: 1}
sends_capabilities: []
actions: []

outcomes:
  # "on every device class that renders the overlay (D1, D3, D4)"
  D1: &suspended
    summary: >-
      A from 20:00; the break suspends it 20 s in and plays 30 s; the
      programme returns at 20:20 and the same execution resumes A from its
      20th second, then B until the window ends at 21:00. No new resolution.
    requests:
      # The window carries no @earliestResolutionTimeOffset: the default 60 s
      # reaches back past 19:50. Resolved once, for the one execution.
      - &resolve
        at: {from: 0, to: 10000}
        url: https://aps.example.com/nl/overlay?s=22&e=5&w=1
        answered_by: scenarios/fixtures/UC-22/overlay-list.xml
      # The insertion: earliestResolutionTimeOffset 20 s before 20:20.
      - &list
        at: {from: 10000, to: 30000}
        url: https://aps.example.com/linear/midroll?s=22&e=5&b=1
        answered_by: examples/annex-b/B.3-1.mpd
      # B.3-1: ImportedMPD earliestResolutionTimeOffset 20 s before its PeriodStart.
      - &sub
        at: {from: 10000, to: 30000}
        url: https://ads-cdn.example.com/cr/201/cr201.mpd
        answered_by: examples/annex-b/B.4-1.mpd
    selection:
      - opportunity: &overlay {fixture: scenarios/fixtures/UC-22/main.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &a {fixture: scenarios/fixtures/UC-22/overlay-list.xml, index: 1}, option: {index: 1}, layout: overlay-lower-third}
          - {candidate: &b {fixture: scenarios/fixtures/UC-22/overlay-list.xml, index: 2}, option: {index: 1}, layout: overlay-lower-third}
      - &break_sel
        opportunity: {fixture: scenarios/fixtures/UC-22/main.mpd, event_id: "2"}
        result: presented
        presented:
          - {candidate: &ad {fixture: examples/annex-b/B.3-1.mpd, id: ad-201}, option: null, layout: linear}
    presentation:
      - &before {start: 0, end: 10000, layout: none, shows: [{element: primary, from: 1190000}]}
      - {start: 10000, end: 30000, layout: overlay-lower-third, shows: [{element: primary, from: 1200000}, {element: ad, candidate: *a, option: {index: 1}}], audio: primary}
      # The insertion stops the programme at 20:20 and resumes it there (RT = PRTA).
      - &break {start: 30000, end: 60000, layout: linear, shows: [{element: ad, candidate: *ad, option: null}]}
      - {start: 60000, end: 70000, layout: overlay-lower-third, shows: [{element: primary, from: 1220000}, {element: ad, candidate: *a, option: {index: 1}}], audio: primary, note: A resumed from its 20th second}
      - {start: 70000, end: 100000, layout: overlay-lower-third, shows: [{element: primary, from: 1230000}, {element: ad, candidate: *b, option: {index: 1}}], audio: primary}
      - {start: 100000, end: 110000, layout: none, shows: [{element: primary, from: 1260000}]}
    beacons:
      # A's slot timeline stops during the break: its 15 s at 25 s, its 30 s at 70 s.
      - {at: 10000, fixture: scenarios/fixtures/UC-22/overlay-list.xml, candidate: *a, id: "1", url: "https://t.example.com/imp?cr=2201"}
      - {at: 25000, fixture: scenarios/fixtures/UC-22/overlay-list.xml, candidate: *a, id: "2", url: "https://t.example.com/mid?cr=2201"}
      - &break_beacons1 {at: 30000, fixture: examples/annex-b/B.4-1.mpd, id: "1", url: "https://t.example.com/imp?cr=201"}
      - &break_beacons2 {at: 37500, fixture: examples/annex-b/B.4-1.mpd, id: "2", url: "https://t.example.com/q1?cr=201"}
      - &break_beacons3 {at: 45000, fixture: examples/annex-b/B.4-1.mpd, id: "3", url: "https://t.example.com/mid?cr=201"}
      - &break_beacons4 {at: 52500, fixture: examples/annex-b/B.4-1.mpd, id: "4", url: "https://t.example.com/q3?cr=201"}
      - &break_beacons5 {at: 60000, fixture: examples/annex-b/B.4-1.mpd, id: "5", url: "https://t.example.com/complete?cr=201"}
      - {at: 70000, fixture: scenarios/fixtures/UC-22/overlay-list.xml, candidate: *a, id: "3", url: "https://t.example.com/complete?cr=2201"}
      - {at: 70000, fixture: scenarios/fixtures/UC-22/overlay-list.xml, candidate: *b, id: "1", url: "https://t.example.com/imp?cr=2202"}
      - {at: 85000, fixture: scenarios/fixtures/UC-22/overlay-list.xml, candidate: *b, id: "2", url: "https://t.example.com/mid?cr=2202"}
      - {at: 100000, fixture: scenarios/fixtures/UC-22/overlay-list.xml, candidate: *b, id: "3", url: "https://t.example.com/complete?cr=2202"}
  D3: *suspended
  D4: *suspended
  # "D2 and D5 skip it, as in UC-03"; the break is played.
  D2: &skip
    summary: The window presents nothing; the 30 s break at 20:20, then the programme from 20:20.
    requests: [*resolve, *list, *sub]
    selection:
      - {opportunity: *overlay, result: declined, presented: []}
      - *break_sel
    presentation: &break_only
      - {start: 0, end: 30000, layout: none, shows: [{element: primary, from: 1190000}]}
      - *break
      - {start: 60000, end: 110000, layout: none, shows: [{element: primary, from: 1220000}]}
    beacons: &break_beacons [*break_beacons1, *break_beacons2, *break_beacons3, *break_beacons4, *break_beacons5]
  D5: *skip
  # "Legacy Player — plays the break and ignores the window (UC-07)."
  legacy:
    summary: Does not recognise the window and never resolves it; plays the break at 20:20 as the base defines.
    requests: [*list, *sub]
    selection:
      - {opportunity: *overlay, result: ignored, presented: []}
      - *break_sel
    presentation: *break_only
    beacons: *break_beacons

missing_carrier:
  - requirement: R13.7
    element: >-
      UC-22: the slot-start beacon fires when A is presented at 20:00 and does
      not fire again when the same execution resumes after the break. No
      carrier: the beacons above are the candidates' own.
    classes: [D1, D3, D4]

disagreements:
  - context: >-
      context/04 UC-22 "The programme returns at 20:20": "The Player resumes
      the same execution: A from its 20th second, then B, until the window
      ends or the cap is reached." (also context/03 R40.4: "When a window with
      the default relation is resumed (R40.9), the Player MUST present the
      suspended form from where it was suspended, then the rest of the
      sequence".)
    annex: >-
      No annex walks UC-22. The specification, §4.5.8 PLY-49 (no relation):
      "A form on screen when an alternative presentation begins ends there,
      and the window presents nothing further. For an alternative
      presentation that begins within the window's span, "nothing further"
      holds for the rest of that span, including the part of it that follows
      the end of the alternative presentation".
    recorded: >-
      The outcomes follow context/04: A resumes at 60 s of the session and B
      follows to 21:00. Under PLY-49 the D1, D3 and D4 outcomes would show
      the programme alone from 60 s and fire none of A's later beacons nor
      any of B's. Not resolved here.
