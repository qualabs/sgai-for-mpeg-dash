# The declared class of every example fixture (ADR 0063).
#
# One entry per file under spec-source/examples/, in the order the prose uses
# them: <path relative to spec-source/examples/>: <class>. Classes:
#   publisher-mpd  an MPD a Publisher writes (a main presentation, or one an
#                  alternative presentation is built from)
#   legacy-view    an MPD as a Player that predates this specification sees it;
#                  judged against the base standard (level 1), not against
#                  context/03 (level 2 is NOT_APPLICABLE)
#   list-mpd       a List MPD (linear resolution document)
#   sps-mpd        a single-period static MPD (an ad sub-MPD)
#   overlay-list   a non-linear resolution document
#   request        an HTTP resolution request (.http, one or more requests)
#   fragment       an excerpt whose root is not a document root
#   vast           an IAB VAST document
#
# bin/check-dash-conformance.py --source checks each declaration against the
# class code deduces from the document (bin/conformance/extract.py); a
# legacy-view is deduced as an MPD. A disagreement is a FAIL (FIX-2).
# This file is read by a restricted parser (bin/conformance/source.py): keep
# the shape `  <path>: <class>` under `fixtures:`, comments on their own line.

