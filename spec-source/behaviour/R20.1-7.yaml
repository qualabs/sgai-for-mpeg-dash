# R20.1 on the linear family, adopted unchanged from §5.16.2.2.5 step 2: two
# InsertPresentation events at the same PRT; event 1's APS answers 500, event 2's
# a 4 s alternative MPD. Observation stops at 5.5 s, before the return to PRTA:
# what the queue does after the return is the reading of §5.16.2.2.5 step 1a the
# T-01 finding leaves open, and is not this criterion.
format: sgai-scenario/1
criterion: R20.1
criterion_sha256: 620e75eecd8499c6e4fa555f51deed1ac20f485cf73a5e4b8805e5ab1519f615
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 5500
entry: behaviour/fixtures/R20.1/r20-1-7-main.mpd
fixtures:
- {path: behaviour/fixtures/R20.1/r20-1-7-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R20.1/r20-1-7-alt.mpd, url: 'https://aps.example.com/b/r20-1-7/b2', class: sps-mpd}
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
aps:
- {url: 'https://aps.example.com/b/r20-1-7/b1', status: 500}
outcomes:
  D1:
    summary: 'R20.1: "An attempt **on a window** that does not produce an ad is a **failed execution**, and on a failed execution the
      Player MUST attempt the next overlapping window of the same family." The base rule: *"If execution fails, steps a-c above are
      repeated for next events in QE"*. Event 2''s alternative from 2 s.'
    requests:
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r20-1-7/b1
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r20-1-7/b2
      answered_by: behaviour/fixtures/R20.1/r20-1-7-alt.mpd
    selection:
    - opportunity: {fixture: behaviour/fixtures/R20.1/r20-1-7-main.mpd, event_id: '2'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R20.1/r20-1-7-alt.mpd, id: alt}
        option: null
        layout: linear
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 5500
      layout: linear
      shows:
      - element: ad
        candidate: *id001
        option: null
    beacons:
    - {at: 2000, fixture: behaviour/fixtures/R20.1/r20-1-7-alt.mpd, id: '1', url: 'https://t.example.com/r20-1-7/imp'}
