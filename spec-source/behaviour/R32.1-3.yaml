# R32.1 — stop: "no further ad is presented; the paused primary frame is
# shown". The document declares stop and one 3 s candidate
# (fixtures/R32.1/stop.xml). Pause at 2 s, resume at 8 s.
# Not written: "A document that declares none means stop". A pause document
# without @onExhausted is not green on level 2 (R32.1a), and a test's
# fixtures must be (see the evidence README, T-04/b).
format: sgai-scenario/1
criterion: R32.1
criterion_sha256: 8fef3afc4557ba66f99afcc820d7e30d0f7d0ed914979eb172ec4e8837970de0
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 10000
entry: behaviour/fixtures/R32.1/main.mpd
fixtures:
  - path: behaviour/fixtures/R32.1/main.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R32.1/stop.xml
    url: https://aps.example.com/behaviour/pause?w=1
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: [{at: 2000, do: pause}, {at: 8000, do: resume}]

outcomes:
  D1: &o
    summary: >-
      The candidate once, 2-5 s; then the paused frame until the resume at
      8 s, with no second pass and no second request; the film continues
      from 2 s.
    requests:
      - {at: {from: 0, to: 2000}, url: "https://aps.example.com/behaviour/pause?w=1", answered_by: behaviour/fixtures/R32.1/stop.xml}
    selection:
      - opportunity: {fixture: behaviour/fixtures/R32.1/main.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &c {fixture: behaviour/fixtures/R32.1/stop.xml, index: 1}, option: {index: 1}, layout: pause-fullscreen}
    presentation:
      - {start: 0, end: 2000, layout: none, shows: [{element: primary, from: 0}]}
      - {start: 2000, end: 5000, layout: pause-fullscreen, shows: [{element: ad, candidate: *c, option: {index: 1}}]}
      - {start: 5000, end: 8000, layout: none, shows: [{element: primary, from: 2000}], note: the paused frame}
      - {start: 8000, end: 10000, layout: none, shows: [{element: primary, from: 2000}]}
    beacons:
      - {at: 2000, fixture: behaviour/fixtures/R32.1/stop.xml, candidate: *c, id: "1", url: "https://t.example.com/imp?cr=3214"}
  D3: *o
  D4: *o
