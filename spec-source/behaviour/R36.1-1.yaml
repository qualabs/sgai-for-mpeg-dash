# R36.1 — "a resolution MUST NOT be requested earlier than the offset before
# the start of the window". An overlay window 10-12 s declaring
# earliestResolutionTimeOffset 3000 (fixtures/R36.1/main-declared.mpd).
# R36.1 is held by the Publisher; what is tested is the bound on the Player.
format: sgai-scenario/1
criterion: R36.1
criterion_sha256: 79148b5e0f6f8a42eaac546bbf9fa135f9d86d6bd8aa9eb67584c44fc13d202a
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 12000
entry: behaviour/fixtures/R36.1/main-declared.mpd
fixtures:
  - path: behaviour/fixtures/R36.1/main-declared.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R36.1/empty.xml
    url: https://aps.example.com/behaviour/r36-1?w=1
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []

outcomes:
  D1: &o
    summary: >-
      No request before 7 s, the declared offset (3 s) before the window's start at 10 s; one request between 7 s and the start, answered by an empty resolution.
    requests:
      - {at: {from: 7000, to: 10000}, url: "https://aps.example.com/behaviour/r36-1?w=1", answered_by: behaviour/fixtures/R36.1/empty.xml}
    selection:
      - {opportunity: {fixture: behaviour/fixtures/R36.1/main-declared.mpd, event_id: "1"}, result: declined, presented: []}
    presentation:
      - {start: 0, end: 12000, layout: none, shows: [{element: primary, from: 0}]}
    beacons: []
  D4: *o
