# R13.6, the part with a carrier: a beacon attached to the candidate fires
# whichever option is presented. Loaded: one 6 s candidate with an HTML option
# then an image option and candidate-level tracking; D3 presents the HTML, D4 the
# image. A Player that ties candidate beacons to one option (e.g. the first) fires
# nothing on D4. The option-level half of R13.6 has no carrier in spec-source
# (<svta:RenderableAsset> admits no <svta:Tracking>): not tested here.
format: sgai-scenario/1
criterion: R13.6
criterion_sha256: f961ccdb5c39aa140dade8c0bb8040e3b8fb88f61e098513c0ae90b947df7eb1
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 10000
entry: behaviour/fixtures/R13.6/r13-6-main.mpd
fixtures:
- {path: behaviour/fixtures/R13.6/r13-6-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R13.6/r13-6-list.xml, url: 'https://aps.example.com/b/r13-6/w', class: overlay-list}
player_capabilities:
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
outcomes:
  D3:
    summary: 'R13.6: "A beacon attached to the candidate fires whichever option is presented." D3 presents the HTML option; the candidate''s
      two beacons fire.'
    requests: &id002
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r13-6/w
      query: {sgai-allowed-layouts: overlay-lower-third}
      answered_by: behaviour/fixtures/R13.6/r13-6-list.xml
    selection:
    - opportunity: {fixture: behaviour/fixtures/R13.6/r13-6-main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R13.6/r13-6-list.xml, index: 1}
        option: {index: 1}
        layout: overlay-lower-third
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 8000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 2000}
      - element: ad
        candidate: *id001
        option: {index: 1}
    - start: 8000
      end: 10000
      layout: none
      shows:
      - {element: primary, from: 8000}
    beacons: &id003
    - at: 2000
      fixture: behaviour/fixtures/R13.6/r13-6-list.xml
      candidate: *id001
      id: '1'
      url: https://t.example.com/r13-6/imp
    - at: 8000
      fixture: behaviour/fixtures/R13.6/r13-6-list.xml
      candidate: *id001
      id: '2'
      url: https://t.example.com/r13-6/complete
  D4:
    summary: 'R13.6: "A beacon attached to the candidate fires whichever option is presented." D4 presents the image option; the candidate''s
      two beacons fire.'
    requests: *id002
    selection:
    - opportunity: {fixture: behaviour/fixtures/R13.6/r13-6-main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: *id001
        option: {index: 2}
        layout: overlay-lower-third
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 8000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 2000}
      - element: ad
        candidate: *id001
        option: {index: 2}
    - start: 8000
      end: 10000
      layout: none
      shows:
      - {element: primary, from: 8000}
    beacons: *id003
