# R29.2 — "A slot parameter is sent when the slot declares its value ...
# and not otherwise." Three windows resolved when they fire
# (earliestResolutionTimeOffset 0), each answered by an empty resolution:
# window 1 declares allowed layouts and a custom region, window 2 allowed
# layouts only, window 3 nothing (fixtures/R29.2/main.mpd).
# The capability half ("Sending a capability parameter is OPTIONAL ... MAY
# send all of them, some of them, or none") is a permission and is not
# decided here: the vector fixes the Player as sending none
# (sends_capabilities []).
format: sgai-scenario/1
criterion: R29.2
criterion_sha256: 13a53858fc65873eacd40df18ac2b3d223b8658a43e03f476715c7bdcbbd4ddc
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 12000
entry: behaviour/fixtures/R29.2/main.mpd
fixtures:
  - path: behaviour/fixtures/R29.2/main.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R29.2/empty.xml
    url: https://aps.example.com/behaviour/r29-2?w=1
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 1, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
aps:
  - {url: "https://aps.example.com/behaviour/r29-2?w=2", status: 200, document: behaviour/fixtures/R29.2/empty.xml}
  - {url: "https://aps.example.com/behaviour/r29-2?w=3", status: 200, document: behaviour/fixtures/R29.2/empty.xml}
actions: []

outcomes:
  D1: &o
    summary: >-
      Window 1's request carries sgai-allowed-layouts and sgai-custom-region,
      window 2's only sgai-allowed-layouts, window 3's no slot parameter; the
      same on a Player that supports `custom` (D1) and one that does not (D4).
    requests:
      - at: 3000
        url: https://aps.example.com/behaviour/r29-2?w=1
        query: {sgai-allowed-layouts: custom overlay-corner, sgai-custom-region: 50 0 50 50}
        answered_by: behaviour/fixtures/R29.2/empty.xml
      - at: 6000
        url: https://aps.example.com/behaviour/r29-2?w=2
        query: {sgai-allowed-layouts: overlay-corner}
        answered_by: behaviour/fixtures/R29.2/empty.xml
      - at: 9000
        url: https://aps.example.com/behaviour/r29-2?w=3
        answered_by: behaviour/fixtures/R29.2/empty.xml
    selection:
      - {opportunity: {fixture: behaviour/fixtures/R29.2/main.mpd, event_id: "1"}, result: declined, presented: []}
      - {opportunity: {fixture: behaviour/fixtures/R29.2/main.mpd, event_id: "2"}, result: declined, presented: []}
      - {opportunity: {fixture: behaviour/fixtures/R29.2/main.mpd, event_id: "3"}, result: declined, presented: []}
    presentation:
      - {start: 0, end: 12000, layout: none, shows: [{element: primary, from: 0}]}
    beacons: []
  D4: *o
