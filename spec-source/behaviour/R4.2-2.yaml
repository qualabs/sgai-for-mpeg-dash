# R4.2 on a linear insertion — the cap (@maxDuration 6000) stops the second ad of
# a List MPD mid-ad, as Table 57 does for an insertion (APDA = min(APD, APDmax)).
# Loaded: an InsertPresentation at 2 s (@executeOnce so the return to PRTA does
# not re-execute it under either reading of §5.16.2.2.5), a List MPD of two 4 s
# ads. A Player that drops on declared duration plays only the first (back at
# 6 s); one that ignores the cap plays both (back at 10 s).
format: sgai-scenario/1
criterion: R4.2
criterion_sha256: 8ba33c5fd2d42cd56759784ec006b996d736085e2c4dea0180b855808174f53d
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 10000
entry: behaviour/fixtures/R4.2/linear-main.mpd
fixtures:
- {path: behaviour/fixtures/R4.2/linear-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R4.2/linear-list.mpd, url: 'https://aps.example.com/b/r4-2-2/break', class: list-mpd}
- {path: behaviour/fixtures/R4.2/linear-ad1.mpd, url: 'https://ads-cdn.example.com/b/r4-2-2/ad1.mpd', class: sps-mpd}
- {path: behaviour/fixtures/R4.2/linear-ad2.mpd, url: 'https://ads-cdn.example.com/b/r4-2-2/ad2.mpd', class: sps-mpd}
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
outcomes:
  D1:
    summary: 'R4.2: "Where the cap bounds cumulative duration — ... and linear insertion — the Player MUST stop rendering once the cumulative
      duration of the accepted candidates would exceed it, even if the stop falls mid-ad." Ad 1 for 4 s, ad 2 for 2 s, then the primary
      content from PRTA (2 s).'
    requests:
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r4-2-2/break
      answered_by: behaviour/fixtures/R4.2/linear-list.mpd
    - at: {from: 0, to: 2000}
      url: https://ads-cdn.example.com/b/r4-2-2/ad1.mpd
      answered_by: behaviour/fixtures/R4.2/linear-ad1.mpd
    - at: {from: 2000, to: 6000}
      url: https://ads-cdn.example.com/b/r4-2-2/ad2.mpd
      answered_by: behaviour/fixtures/R4.2/linear-ad2.mpd
    selection:
    - opportunity: {fixture: behaviour/fixtures/R4.2/linear-main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R4.2/linear-list.mpd, id: ad-1}
        option: null
        layout: linear
      - candidate: &id002 {fixture: behaviour/fixtures/R4.2/linear-list.mpd, id: ad-2}
        option: null
        layout: linear
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 6000
      layout: linear
      shows:
      - element: ad
        candidate: *id001
        option: null
    - start: 6000
      end: 8000
      layout: linear
      shows:
      - element: ad
        candidate: *id002
        option: null
    - start: 8000
      end: 10000
      layout: none
      shows:
      - {element: primary, from: 2000}
    beacons:
    - {at: 2000, fixture: behaviour/fixtures/R4.2/linear-ad1.mpd, id: '1', url: 'https://t.example.com/r4-2-2/ad1-imp'}
    - {at: 6000, fixture: behaviour/fixtures/R4.2/linear-ad2.mpd, id: '11', url: 'https://t.example.com/r4-2-2/ad2-imp'}
