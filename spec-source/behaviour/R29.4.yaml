# R29.4 — "A parameter that is not one of the reserved names MUST carry a
# vendor-specific prefix." The window's URI carries the Publisher's own
# unprefixed parameters (title, device), which are not the Player's
# (fixtures/R29.4/main.mpd). The request's `query` lists everything the
# Player adds: the reserved slot parameter, and nothing else. A Player that
# adds an unprefixed name of its own (`model=...`) adds a parameter this
# outcome does not list.
# A vendor-prefixed parameter is allowed (`extra_query_pattern`): the form of
# the prefix is the specification's, `x-<vendor>-` (spec §5.8.4, "a vendor
# prefix of the form `x-<vendor>-`"), since "vendor-specific prefix" alone
# cannot tell a prefixed name from an unprefixed one.
format: sgai-scenario/1
criterion: R29.4
criterion_sha256: 848946a5940c1716f61c2fbfc9f800fdfa541e49ea055b8d15403b48f604e195
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 6000
entry: behaviour/fixtures/R29.4/main.mpd
fixtures:
  - path: behaviour/fixtures/R29.4/main.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R29.4/empty.xml
    url: https://aps.example.com/behaviour/r29-4?title=beh294&device=tv
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []

outcomes:
  D1: &o
    summary: >-
      The Publisher's query is kept as written and the Player appends only
      sgai-allowed-layouts, plus only vendor-prefixed (x-<vendor>-) parameters
      of its own; no unprefixed parameter of the Player's own.
    requests:
      - at: 3000
        url: https://aps.example.com/behaviour/r29-4?title=beh294&device=tv
        query: {sgai-allowed-layouts: overlay-corner}
        extra_query_pattern: 'x-[a-z0-9]+-[A-Za-z0-9._~-]+'
        answered_by: behaviour/fixtures/R29.4/empty.xml
    selection:
      - {opportunity: {fixture: behaviour/fixtures/R29.4/main.mpd, event_id: "1"}, result: declined, presented: []}
    presentation:
      - {start: 0, end: 6000, layout: none, shows: [{element: primary, from: 0}]}
    beacons: []
  D4: *o
