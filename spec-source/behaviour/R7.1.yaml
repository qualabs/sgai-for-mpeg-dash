# R7.1 — document order is presentation order: no re-ordering, no deduplication,
# a skipped candidate occupies no time. Loaded: one overlay window (cap 20 s),
# three candidates: an image (4 s), an HTML-only one (2 s), and the same image
# again (4 s). A Player that sorts (e.g. by duration) shows candidate 2 first; one
# that deduplicates drops candidate 3; one that keeps the skipped candidate's slot
# on D4 leaves a 2 s gap before candidate 3.
format: sgai-scenario/1
criterion: R7.1
criterion_sha256: dbd654d4d530efdda757e4a043330e2320e42f8e4f15a85a7cbb0a1a37a7d2e9
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 14000
entry: behaviour/fixtures/R7.1/r7-1-main.mpd
fixtures:
- {path: behaviour/fixtures/R7.1/r7-1-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R7.1/r7-1-list.xml, url: 'https://aps.example.com/b/r7-1/w', class: overlay-list}
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
outcomes:
  D1:
    summary: 'R7.1: "they MUST be presented in that order, each starting when the previous one ends, and MUST NOT be re-ordered, deduplicated
      or otherwise rearranged." Candidates 1, 2, 3 back to back from 2 s; candidate 3 repeats candidate 1''s creative and is still shown.'
    requests: &id004
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r7-1/w
      query: {sgai-allowed-layouts: overlay-lower-third}
      answered_by: behaviour/fixtures/R7.1/r7-1-list.xml
    selection:
    - opportunity: {fixture: behaviour/fixtures/R7.1/r7-1-main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R7.1/r7-1-list.xml, index: 1}
        option: {index: 1}
        layout: overlay-lower-third
      - candidate: &id002 {fixture: behaviour/fixtures/R7.1/r7-1-list.xml, index: 2}
        option: {index: 1}
        layout: overlay-lower-third
      - candidate: &id003 {fixture: behaviour/fixtures/R7.1/r7-1-list.xml, index: 3}
        option: {index: 1}
        layout: overlay-lower-third
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 6000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 2000}
      - element: ad
        candidate: *id001
        option: {index: 1}
    - start: 6000
      end: 8000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 6000}
      - element: ad
        candidate: *id002
        option: {index: 1}
    - start: 8000
      end: 12000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 8000}
      - element: ad
        candidate: *id003
        option: {index: 1}
    - start: 12000
      end: 14000
      layout: none
      shows:
      - {element: primary, from: 12000}
    beacons:
    - at: 2000
      fixture: behaviour/fixtures/R7.1/r7-1-list.xml
      candidate: *id001
      id: '1'
      url: https://t.example.com/r7-1/c1-imp
    - at: 6000
      fixture: behaviour/fixtures/R7.1/r7-1-list.xml
      candidate: *id002
      id: '1'
      url: https://t.example.com/r7-1/c2-imp
    - at: 8000
      fixture: behaviour/fixtures/R7.1/r7-1-list.xml
      candidate: *id003
      id: '1'
      url: https://t.example.com/r7-1/c3-imp
  D4:
    summary: 'R7.1: "A candidate skipped under R5.3 is not a rearrangement and occupies no time: the next one starts where the skipped
      one would have started." D4 renders no HTML: candidate 2 is skipped and candidate 3 starts at 6 s, where candidate 2 would have.'
    requests: *id004
    selection:
    - opportunity: {fixture: behaviour/fixtures/R7.1/r7-1-main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: *id001
        option: {index: 1}
        layout: overlay-lower-third
      - candidate: *id003
        option: {index: 1}
        layout: overlay-lower-third
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 6000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 2000}
      - element: ad
        candidate: *id001
        option: {index: 1}
    - start: 6000
      end: 10000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 6000}
      - element: ad
        candidate: *id003
        option: {index: 1}
    - start: 10000
      end: 14000
      layout: none
      shows:
      - {element: primary, from: 10000}
    beacons:
    - at: 2000
      fixture: behaviour/fixtures/R7.1/r7-1-list.xml
      candidate: *id001
      id: '1'
      url: https://t.example.com/r7-1/c1-imp
    - at: 6000
      fixture: behaviour/fixtures/R7.1/r7-1-list.xml
      candidate: *id003
      id: '1'
      url: https://t.example.com/r7-1/c3-imp
