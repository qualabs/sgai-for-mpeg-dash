# R4.7 on a linear insertion — @maxDuration="0": the event is not executed.
# Loaded: an InsertPresentation at 2 s with @maxDuration 0 and
# @earliestResolutionTimeOffset 0 (so the only moment it could be resolved is its
# execution, §5.16.2.2.6 "The alternative MPD is resolved at each execution of the
# Event"); the APS would answer a 4 s ad. A Player that reads zero as a very short
# slot requests it and may start it.
format: sgai-scenario/1
criterion: R4.7
criterion_sha256: 49581879ebd12a7cfdc8d7f0119754b0fc8629578761a8949559ea25ba5d8f31
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 6000
entry: behaviour/fixtures/R4.7/linear-main.mpd
fixtures:
- {path: behaviour/fixtures/R4.7/linear-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R4.7/linear-alt.mpd, url: 'https://aps.example.com/b/r4-7-1/break', class: sps-mpd}
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
outcomes:
  D1:
    summary: 'R4.7: "A declared cap of zero means the opportunity does not fire ... *"If the value of `@maxDuration` is zero, the event
      is not executed"* (§5.16.5)". No request, the primary content throughout.'
    requests: []
    selection: []
    presentation:
    - start: 0
      end: 6000
      layout: none
      shows:
      - {element: primary, from: 0}
    beacons: []
