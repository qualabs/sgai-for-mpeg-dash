# R13.3, removed on resume from a pause. Loaded: a pause window over the first
# 60 s, its document one 10 s fullscreen image with beacons at 0, 2, 6 and 10 s;
# the viewer pauses at 3 s and resumes at 7 s (4 s into the pause ad). A Player
# that keeps the schedule after the resume fires the last two.
format: sgai-scenario/1
criterion: R13.3
criterion_sha256: e4f44c899c676e4a7e6628bbf67f86dabe69832b3ac5d0de182625b9c029e4a6
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 9000
entry: behaviour/fixtures/R13.3/r13-3-3-main.mpd
fixtures:
- {path: behaviour/fixtures/R13.3/r13-3-3-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R13.3/r13-3-3-list.xml, url: 'https://aps.example.com/b/r13-3-3/pause', class: overlay-list}
player_capabilities:
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions:
- {at: 3000, do: pause}
- {at: 7000, do: resume}
outcomes:
  D4:
    summary: 'R13.3: "A beacon whose time falls after the presentation of its ad has ended — ... or removed on resume from a pause (R16.1)
      — MUST NOT be fired." The pause ad from 3 s to 7 s: the beacons at 0 and 2 s fire, those at 6 and 10 s do not; the primary content
      resumes from 3 s.'
    requests:
    - at: {from: 0, to: 3000}
      url: https://aps.example.com/b/r13-3-3/pause
      query: {sgai-allowed-layouts: pause-fullscreen}
      answered_by: behaviour/fixtures/R13.3/r13-3-3-list.xml
    selection:
    - opportunity: {fixture: behaviour/fixtures/R13.3/r13-3-3-main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R13.3/r13-3-3-list.xml, index: 1}
        option: {index: 1}
        layout: pause-fullscreen
    presentation:
    - start: 0
      end: 3000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 3000
      end: 7000
      layout: pause-fullscreen
      shows:
      - element: ad
        candidate: *id001
        option: {index: 1}
    - start: 7000
      end: 9000
      layout: none
      shows:
      - {element: primary, from: 3000}
    beacons:
    - at: 3000
      fixture: behaviour/fixtures/R13.3/r13-3-3-list.xml
      candidate: *id001
      id: '1'
      url: https://t.example.com/r13-3-3/imp
    - at: 5000
      fixture: behaviour/fixtures/R13.3/r13-3-3-list.xml
      candidate: *id001
      id: '2'
      url: https://t.example.com/r13-3-3/at-2s
