# R5.3 — a candidate none of whose options the device can render is
# skipped, and the Player falls through to the next one; with none
# rendered the attempt produced no ad. Candidate 1 is HTML only, candidate 2
# image only (fixtures/R5.3/overlay-list.xml); the class decides which
# branch of the criterion is walked: D3 renders both, D4 skips candidate 1,
# D5 renders neither.
format: sgai-scenario/1
criterion: R5.3
criterion_sha256: 730fe21aa705324211f77bd49851701f631c9f87a6bf179aea336d5e311b4c25
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 17000
entry: behaviour/fixtures/R5.3/main.mpd
fixtures:
  - path: behaviour/fixtures/R5.3/main.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R5.3/overlay-list.xml
    url: https://aps.example.com/behaviour/r5-3?w=1
    class: overlay-list
player_capabilities:
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D5: {sgai-video-decoders: 1, sgai-image-over-video: 0, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []

outcomes:
  D3:
    summary: >-
      Reference outcome, no candidate skipped: the HTML candidate 5 s to 10 s,
      then the image candidate 10 s to 15 s.
    requests: [&resolve {at: {from: 0, to: 5000}, url: "https://aps.example.com/behaviour/r5-3?w=1", answered_by: behaviour/fixtures/R5.3/overlay-list.xml}]
    selection:
      - opportunity: &opp {fixture: behaviour/fixtures/R5.3/main.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &c1 {fixture: behaviour/fixtures/R5.3/overlay-list.xml, index: 1}, option: {index: 1}, layout: overlay-lower-third}
          - {candidate: &c2 {fixture: behaviour/fixtures/R5.3/overlay-list.xml, index: 2}, option: {index: 1}, layout: overlay-lower-third}
    presentation:
      - &before {start: 0, end: 5000, layout: none, shows: [{element: primary, from: 0}]}
      - {start: 5000, end: 10000, layout: overlay-lower-third, shows: [{element: primary, from: 5000}, {element: ad, candidate: *c1, option: {index: 1}}]}
      - {start: 10000, end: 15000, layout: overlay-lower-third, shows: [{element: primary, from: 10000}, {element: ad, candidate: *c2, option: {index: 1}}]}
      - {start: 15000, end: 17000, layout: none, shows: [{element: primary, from: 15000}]}
    beacons:
      - {at: 5000, fixture: behaviour/fixtures/R5.3/overlay-list.xml, candidate: *c1, id: "1", url: "https://t.example.com/imp?cr=531"}
      - &b2 {at: 10000, fixture: behaviour/fixtures/R5.3/overlay-list.xml, candidate: *c2, id: "1", url: "https://t.example.com/imp?cr=532"}
  D4:
    summary: >-
      "A candidate none of whose options satisfies R5.6 ... MUST be skipped,
      and the Player falls through to the next candidate": the HTML-only
      candidate 1 is skipped and fires nothing; candidate 2 is shown from the
      window's start, 5 s to 10 s ("when at least one was rendered, the
      Player MUST continue with the primary content"), then the film alone.
    requests: [*resolve]
    selection:
      - opportunity: *opp
        result: presented
        presented:
          - {candidate: *c2, option: {index: 1}, layout: overlay-lower-third}
    presentation:
      - *before
      - {start: 5000, end: 10000, layout: overlay-lower-third, shows: [{element: primary, from: 5000}, {element: ad, candidate: *c2, option: {index: 1}}]}
      - {start: 10000, end: 17000, layout: none, shows: [{element: primary, from: 10000}]}
    beacons:
      - {at: 5000, fixture: behaviour/fixtures/R5.3/overlay-list.xml, candidate: *c2, id: "1", url: "https://t.example.com/imp?cr=532"}
  D5:
    summary: >-
      "When the candidates are exhausted and none was rendered, the attempt
      produced no ad": both candidates skipped, nothing on screen, no beacon;
      there is no other window, so the film plays uninterrupted (R20.1).
    requests: [*resolve]
    selection:
      - opportunity: *opp
        result: declined
        presented: []
    presentation:
      - {start: 0, end: 17000, layout: none, shows: [{element: primary, from: 0}]}
    beacons: []
