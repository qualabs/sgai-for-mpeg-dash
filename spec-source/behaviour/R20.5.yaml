# R20.5 — each window of the chain binds what it serves with its own declarations.
# Loaded: window 1 (admits overlay-corner only, cap 10 s) answers 404; window 2
# (admits overlay-lower-third only, cap 4 s) answers one candidate with two 8 s
# image options, corner first and lower-third second. A Player applying window 1's
# declarations shows the corner option for 8 s.
format: sgai-scenario/1
criterion: R20.5
criterion_sha256: d033ddc4e7eb82eddd237d5c5d44e5578cbf7ac433039dbbead05794c804f25a
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 9000
entry: behaviour/fixtures/R20.5/r20-5-main.mpd
fixtures:
- {path: behaviour/fixtures/R20.5/r20-5-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R20.5/r20-5-w2.xml, url: 'https://aps.example.com/b/r20-5/w2', class: overlay-list}
player_capabilities:
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
aps:
- {url: 'https://aps.example.com/b/r20-5/w1', status: 404}
outcomes:
  D4:
    summary: 'R20.5: "The Player MUST bind the candidates each window in a fallback chain serves with **that window''s own** declarations:
      its allowed layouts and its maximum duration." Window 2 admits only the lower-third and caps at 4 s: option 2 (lower-third) from
      2 s, stopped at 6 s.'
    requests:
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r20-5/w1
      query: {sgai-allowed-layouts: overlay-corner}
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r20-5/w2
      query: {sgai-allowed-layouts: overlay-lower-third}
      answered_by: behaviour/fixtures/R20.5/r20-5-w2.xml
    selection:
    - opportunity: {fixture: behaviour/fixtures/R20.5/r20-5-main.mpd, event_id: '2'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R20.5/r20-5-w2.xml, index: 1}
        option: {index: 2}
        layout: overlay-lower-third
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 6000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 2000}
      - element: ad
        candidate: *id001
        option: {index: 2}
    - start: 6000
      end: 9000
      layout: none
      shows:
      - {element: primary, from: 6000}
    beacons:
    - at: 2000
      fixture: behaviour/fixtures/R20.5/r20-5-w2.xml
      candidate: *id001
      id: '1'
      url: https://t.example.com/r20-5/imp
