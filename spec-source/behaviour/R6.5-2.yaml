# R6.5 on a List MPD — the base scope: the ads of one List MPD share one @id scope.
# Loaded: an InsertPresentation at 2 s, a List MPD of two 4 s ads whose sub-MPDs
# both number a callback @id 1 (different URLs); ad 2 also has @id 2 at 2 s. The
# base ignores the second @id 1 (§5.10.2.4, Table 44). A Player that applies the
# per-candidate scope of the non-linear document here fires ad 2's @id 1 too.
format: sgai-scenario/1
criterion: R6.5
criterion_sha256: 3e3278cc0bd34e55ea410212200efba949f33f99e1d79c726bb84965a6211ece
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 12000
entry: behaviour/fixtures/R6.5/linear-main.mpd
fixtures:
- {path: behaviour/fixtures/R6.5/linear-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R6.5/linear-list.mpd, url: 'https://aps.example.com/b/r6-5-2/break', class: list-mpd}
- {path: behaviour/fixtures/R6.5/linear-ad1.mpd, url: 'https://ads-cdn.example.com/b/r6-5-2/ad1.mpd', class: sps-mpd}
- {path: behaviour/fixtures/R6.5/linear-ad2.mpd, url: 'https://ads-cdn.example.com/b/r6-5-2/ad2.mpd', class: sps-mpd}
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
outcomes:
  D1:
    summary: 'R6.5: "On a `ListMPD` the base scope applies unchanged (R1.5): `Event@id` is scoped to its `@schemeIdUri` / `@value` pair
      over the whole media presentation (DASH Table 44), so the ads of one `ListMPD`, streams merged from their sub-MPDs included, share
      one scope." Ad 1''s @id 1 at 2 s, ad 2''s @id 2 at 8 s; ad 2''s @id 1 does not fire.'
    requests:
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r6-5-2/break
      answered_by: behaviour/fixtures/R6.5/linear-list.mpd
    - at: {from: 0, to: 2000}
      url: https://ads-cdn.example.com/b/r6-5-2/ad1.mpd
      answered_by: behaviour/fixtures/R6.5/linear-ad1.mpd
    - at: {from: 2000, to: 6000}
      url: https://ads-cdn.example.com/b/r6-5-2/ad2.mpd
      answered_by: behaviour/fixtures/R6.5/linear-ad2.mpd
    selection:
    - opportunity: {fixture: behaviour/fixtures/R6.5/linear-main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R6.5/linear-list.mpd, id: ad-1}
        option: null
        layout: linear
      - candidate: &id002 {fixture: behaviour/fixtures/R6.5/linear-list.mpd, id: ad-2}
        option: null
        layout: linear
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 6000
      layout: linear
      shows:
      - element: ad
        candidate: *id001
        option: null
    - start: 6000
      end: 10000
      layout: linear
      shows:
      - element: ad
        candidate: *id002
        option: null
    - start: 10000
      end: 12000
      layout: none
      shows:
      - {element: primary, from: 2000}
    beacons:
    - {at: 2000, fixture: behaviour/fixtures/R6.5/linear-ad1.mpd, id: '1', url: 'https://t.example.com/r6-5-2/ad1-imp'}
    - {at: 8000, fixture: behaviour/fixtures/R6.5/linear-ad2.mpd, id: '2', url: 'https://t.example.com/r6-5-2/ad2-mid'}
