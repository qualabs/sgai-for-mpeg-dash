# R38.2 — "When the slot declares allowed layouts, the Player MUST send the
# declared set, unchanged ... When the slot declares none, nothing is sent."
# Window 1 declares a set in an order that is neither the tokens' own nor
# alphabetical; window 2 declares none (fixtures/R38.2/main.mpd). Both are
# resolved when they fire and answered by an empty resolution.
format: sgai-scenario/1
criterion: R38.2
criterion_sha256: 1123d2ea41fb59db8298045bbeb960ff79f305d576a99c05131dddf150d4ef8a
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 9000
entry: behaviour/fixtures/R38.2/main.mpd
fixtures:
  - path: behaviour/fixtures/R38.2/main.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R38.2/empty.xml
    url: https://aps.example.com/behaviour/r38-2?w=1
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
aps:
  - {url: "https://aps.example.com/behaviour/r38-2?w=2", status: 200, document: behaviour/fixtures/R38.2/empty.xml}
actions: []

outcomes:
  D1: &o
    summary: >-
      Window 1's request carries sgai-allowed-layouts with the declared value
      byte for byte, order kept; window 2's carries no sgai-allowed-layouts,
      not even the family default.
    requests:
      - at: 3000
        url: https://aps.example.com/behaviour/r38-2?w=1
        query: {sgai-allowed-layouts: overlay-corner squeezeback-double-box overlay-lower-third}
        answered_by: behaviour/fixtures/R38.2/empty.xml
      - at: 6000
        url: https://aps.example.com/behaviour/r38-2?w=2
        answered_by: behaviour/fixtures/R38.2/empty.xml
    selection:
      - {opportunity: {fixture: behaviour/fixtures/R38.2/main.mpd, event_id: "1"}, result: declined, presented: []}
      - {opportunity: {fixture: behaviour/fixtures/R38.2/main.mpd, event_id: "2"}, result: declined, presented: []}
    presentation:
      - {start: 0, end: 9000, layout: none, shows: [{element: primary, from: 0}]}
    beacons: []
  D4: *o
