# R40.9 — `supersede`, when the window presents no ad. The R40.9-2
# documents, with the test APS answering the window's resolution request
# with a 500 and no body: a failed execution (R20.1, "a final HTTP status
# other than 200").
#
# When the insertion starts. R40.9 sends the event to the base
# specification, and with @earliestResolutionTimeOffset 0 the List MPD "can
# be retrieved at any time between PRT – T and PRT" (5.16.5.2), that is at
# 6 s and not before. The ad's first frame cannot precede that request, its
# answer, the ad MPD and the ad's first segments, so the boundary cannot be
# 6 s exactly. The base specification bounds how late it may be: the event
# is executed at PRTA with "PRT ≤ PRTA ≤ EAP" (5.16.2.1), and "the
# execution may happen later, i.e. when PRTA > PRT and PRTA = PHP. If the
# event is no longer active, it is ignored" (5.16.2.2.1). EAP is PRT + Event@duration = 7 s. So
# the ad starts in the window 6000..7000 (written 6001..7000 on the segment,
# which must be longer than the hold before it; strictly after PRT, since the
# List MPD is only requested at PRT; the tolerance makes the 1 ms moot), and
# everything timed from it (the ad MPD's request, its end, its two beacons,
# the programme's return) moves with it by up to the same 1000. While the break resolves the Player may
# hold the programme at 6 s (5.16.2.2.6, NOTE 2: "Attempting resolution at
# time PRTA is an acceptable practice, however this can result in a
# non-smooth transition") or play on; the second segment is that hold, and
# it may be empty (a Player that plays on, or holds for less than the
# tolerance, shows no change at 6 s). The programme returns at RT = PRTA,
# "For Insertion events RT is defined as PRTA" (5.16.2.2.1): its `from` is
# the same window. The hold counts on the session clock at wall time
# (scenarios/README.md), as the content it stands for would have.
format: sgai-scenario/1
criterion: R40.9
criterion_sha256: 5719078dc00fc9a2bd5b425b7a4bbc84c49fc6a42827348ba3a7b6f6d46d0a7c
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 14000
entry: behaviour/fixtures/R40.9/main-supersede.mpd
fixtures:
  - path: behaviour/fixtures/R40.9/main-supersede.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R40.9/list.mpd
    url: https://aps.example.com/beh/r40-9/break
    class: list-mpd
  - path: behaviour/fixtures/R40.9/ad.mpd
    url: https://ads-cdn.example.com/beh/r40-9/ad.mpd
    class: sps-mpd
aps:
  - {url: "https://aps.example.com/beh/r40-9/overlay-s", status: 500}
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []

outcomes:
  D1: &fallback
    summary: >-
      Decides R40.9 "When the window presents no ad — every attempt to
      resolve it is a failed execution under R20.1 ... — those events MUST be
      executed as the base specification defines": the window's request
      fails, nothing is overlaid, and the insertion at 6 s plays its 6 s ad;
      the programme returns at 6 s.
    requests:
      - at: {from: 0, to: 2000}
        url: https://aps.example.com/beh/r40-9/overlay-s
      # @earliestResolutionTimeOffset 0: at 6 s.
      - at: 6000
        url: https://aps.example.com/beh/r40-9/break
        answered_by: behaviour/fixtures/R40.9/list.mpd
      - at: {from: 6000, to: 7000}
        url: https://ads-cdn.example.com/beh/r40-9/ad.mpd
        answered_by: behaviour/fixtures/R40.9/ad.mpd
    selection:
      - opportunity: {fixture: behaviour/fixtures/R40.9/main-supersede.mpd, event_id: "2"}
        result: presented
        presented:
          - {candidate: &lin {fixture: behaviour/fixtures/R40.9/list.mpd, id: ad-1}, option: null, layout: linear}
    presentation:
      - {start: 0, end: 6000, layout: none, shows: [{element: primary, from: 0}]}
      - {start: 6000, end: &ad-in {from: 6001, to: 7000}, layout: none, shows: [{element: primary, from: 6000}], note: the programme held while the break resolves; may be empty}
      - {start: *ad-in, end: &ad-out {from: 12000, to: 13000}, layout: linear, shows: [{element: ad, candidate: *lin, option: null}]}
      - {start: *ad-out, end: 14000, layout: none, shows: [{element: primary, from: &prta {from: 6000, to: 7000}}], note: RT = PRTA}
    beacons:
      - {at: *prta, fixture: behaviour/fixtures/R40.9/ad.mpd, id: "1", url: "https://t.example.com/r40-9/imp"}
      - {at: *ad-out, fixture: behaviour/fixtures/R40.9/ad.mpd, id: "2", url: "https://t.example.com/r40-9/complete"}
  D4: *fallback
