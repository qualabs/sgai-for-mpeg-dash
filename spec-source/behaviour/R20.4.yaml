# R20.4 — a resolution document of the wrong family is a failed execution and the
# chain continues. Loaded: overlay windows 1 and 2 over the same span (both admit
# overlay-lower-third); window 1 is answered by a well-formed <svta:OverlayList
# family="pause"> whose one candidate is an image the device can render, window 2
# by an overlay document with one 5 s image. A Player that ignores @family shows
# window 1's image.
format: sgai-scenario/1
criterion: R20.4
criterion_sha256: 9be1124b94f85f5fadc76a37f08a69f91ebfdca517fba7e673e04149adc03bf7
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 9000
entry: behaviour/fixtures/R20.4/r20-4-main.mpd
fixtures:
- {path: behaviour/fixtures/R20.4/r20-4-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R20.4/r20-4-w1.xml, url: 'https://aps.example.com/b/r20-4/w1', class: overlay-list}
- {path: behaviour/fixtures/R20.4/r20-4-w2.xml, url: 'https://aps.example.com/b/r20-4/w2', class: overlay-list}
player_capabilities:
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
outcomes:
  D4:
    summary: 'R20.1: "An attempt **on a window** that does not produce an ad is a **failed execution**, and on a failed execution the
      Player MUST attempt the next overlapping window of the same family." R20.4: "A resolution document whose family does not match
      the slot that requested it ... MUST be treated as a failed execution, its candidates MUST NOT be presented in the slot, and the
      chain of R20.1 MUST continue to the next overlapping window of the slot''s family." Window 1 is declined; window 2''s image from
      2 s to 7 s.'
    requests:
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r20-4/w1
      query: {sgai-allowed-layouts: overlay-lower-third}
      answered_by: behaviour/fixtures/R20.4/r20-4-w1.xml
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r20-4/w2
      query: {sgai-allowed-layouts: overlay-lower-third}
      answered_by: behaviour/fixtures/R20.4/r20-4-w2.xml
    selection:
    - opportunity: {fixture: behaviour/fixtures/R20.4/r20-4-main.mpd, event_id: '1'}
      result: declined
      presented: []
    - opportunity: {fixture: behaviour/fixtures/R20.4/r20-4-main.mpd, event_id: '2'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R20.4/r20-4-w2.xml, index: 1}
        option: {index: 1}
        layout: overlay-lower-third
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 7000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 2000}
      - element: ad
        candidate: *id001
        option: {index: 1}
    - start: 7000
      end: 9000
      layout: none
      shows:
      - {element: primary, from: 7000}
    beacons:
    - at: 2000
      fixture: behaviour/fixtures/R20.4/r20-4-w2.xml
      candidate: *id001
      id: '1'
      url: https://t.example.com/r20-4/fb-imp
