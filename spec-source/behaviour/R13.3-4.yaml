# R13.3, the edges of the trim. Loaded: an overlay window with @durationCap 4000,
# one 8 s image candidate whose Tracking has @presentationTimeOffset 1000 and
# beacons at 1000 (0 s of the ad), 5000 (4 s: exactly at the trim) and 5300
# (4.3 s: 300 ms past it). A Player that does not subtract the offset fires each
# beacon 1 s late; one that keeps the schedule after the trim fires the last.
# The beacon exactly at the trim is expected to fire: R13.3 forbids a beacon
# whose time falls "after" the presentation has ended, and the spec's §5.5.2
# speaks of beacons "after a trim boundary"; neither says whether a beacon at
# the boundary itself fires. That reading is this test's, not the standard's.
format: sgai-scenario/1
criterion: R13.3
criterion_sha256: e4f44c899c676e4a7e6628bbf67f86dabe69832b3ac5d0de182625b9c029e4a6
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 9000
entry: behaviour/fixtures/R13.3/r13-3-4-main.mpd
fixtures:
- {path: behaviour/fixtures/R13.3/r13-3-4-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R13.3/r13-3-4-list.xml, url: 'https://aps.example.com/b/r13-3-4/w', class: overlay-list}
player_capabilities:
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
outcomes:
  D4:
    summary: 'R13.3: "A beacon whose time falls after the presentation of its ad has ended — trimmed by the cap (R4) ... — MUST NOT
      be fired." Trimmed at 4 s of the ad (6 s), @presentationTimeOffset 1000 subtracted: the beacons at 0 s and at
      the trim (4 s) fire, the one 300 ms past the trim does not. That a beacon exactly at the trim fires is a reading
      the standard leaves open.'
    requests:
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r13-3-4/w
      query: {sgai-allowed-layouts: overlay-lower-third}
      answered_by: behaviour/fixtures/R13.3/r13-3-4-list.xml
    selection:
    - opportunity: {fixture: behaviour/fixtures/R13.3/r13-3-4-main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: &c1 {fixture: behaviour/fixtures/R13.3/r13-3-4-list.xml, index: 1}
        option: {index: 1}
        layout: overlay-lower-third
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 6000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 2000}
      - element: ad
        candidate: *c1
        option: {index: 1}
    - start: 6000
      end: 9000
      layout: none
      shows:
      - {element: primary, from: 6000}
    beacons:
    - at: 2000
      fixture: behaviour/fixtures/R13.3/r13-3-4-list.xml
      candidate: *c1
      id: '1'
      url: https://t.example.com/r13-3-4/imp
    - at: 6000
      fixture: behaviour/fixtures/R13.3/r13-3-4-list.xml
      candidate: *c1
      id: '2'
      url: https://t.example.com/r13-3-4/at-trim
