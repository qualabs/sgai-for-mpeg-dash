    reason: "a permission (MAY implement a pause by any mechanism): every mechanism conforms, so nothing can fail; where the pause resumes is R37.2's"
  - criterion: R44.3
    criterion_sha256: 7b4bf882e4a1f60b5b50aa2d8be7b60df1ed539761b683ed6dfca61aa8dc1398
    reason: "running a verification SDK is optional, and the verification resources it would be handed have no carrier (R44.1, Not placed row 9)"
