# R32.1 — request-again: "a new resolution document is requested for the
# same pause". The first document declares request-again and one 3 s
# candidate (fixtures/R32.1/request-again.xml); the second request is
# answered by a document declaring stop with another 3 s candidate
# (fixtures/R32.1/second.xml). Pause at 2 s, resume at 10 s.
format: sgai-scenario/1
criterion: R32.1
criterion_sha256: 8fef3afc4557ba66f99afcc820d7e30d0f7d0ed914979eb172ec4e8837970de0
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 12000
entry: behaviour/fixtures/R32.1/main.mpd
fixtures:
  - path: behaviour/fixtures/R32.1/main.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R32.1/request-again.xml
    url: https://aps.example.com/behaviour/pause?w=1
    class: overlay-list
  - path: behaviour/fixtures/R32.1/second.xml
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
aps:
  - {url: "https://aps.example.com/behaviour/pause?w=1", nth: 1, status: 200, document: behaviour/fixtures/R32.1/request-again.xml}
  - {url: "https://aps.example.com/behaviour/pause?w=1", nth: 2, status: 200, document: behaviour/fixtures/R32.1/second.xml}
actions: [{at: 2000, do: pause}, {at: 10000, do: resume}]

outcomes:
  D1: &o
    summary: >-
      The first document's candidate 2-5 s; at its end, a second request in
      the same pause; the second document's candidate 5-8 s; that document
      says stop, so the paused frame 8-10 s; the film continues from 2 s.
    requests:
      - {at: {from: 0, to: 2000}, url: "https://aps.example.com/behaviour/pause?w=1", answered_by: behaviour/fixtures/R32.1/request-again.xml}
      - {at: 5000, url: "https://aps.example.com/behaviour/pause?w=1", answered_by: behaviour/fixtures/R32.1/second.xml}
    selection:
      - opportunity: {fixture: behaviour/fixtures/R32.1/main.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &c1 {fixture: behaviour/fixtures/R32.1/request-again.xml, index: 1}, option: {index: 1}, layout: pause-fullscreen}
          - {candidate: &c2 {fixture: behaviour/fixtures/R32.1/second.xml, index: 1}, option: {index: 1}, layout: pause-fullscreen}
    presentation:
      - {start: 0, end: 2000, layout: none, shows: [{element: primary, from: 0}]}
      - {start: 2000, end: 5000, layout: pause-fullscreen, shows: [{element: ad, candidate: *c1, option: {index: 1}}]}
      - {start: 5000, end: 8000, layout: pause-fullscreen, shows: [{element: ad, candidate: *c2, option: {index: 1}}]}
      - {start: 8000, end: 10000, layout: none, shows: [{element: primary, from: 2000}], note: the paused frame}
      - {start: 10000, end: 12000, layout: none, shows: [{element: primary, from: 2000}]}
    beacons:
      - {at: 2000, fixture: behaviour/fixtures/R32.1/request-again.xml, candidate: *c1, id: "1", url: "https://t.example.com/imp?cr=3212"}
      - {at: 5000, fixture: behaviour/fixtures/R32.1/second.xml, candidate: *c2, id: "1", url: "https://t.example.com/imp?cr=3213"}
  D3: *o
  D4: *o
