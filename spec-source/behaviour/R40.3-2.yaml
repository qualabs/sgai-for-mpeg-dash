# R40.3, late: the window is known to present no ad only after the event's PRT.
# Loaded: as R40.3-1, but the window has @earliestResolutionTimeOffset 0 (resolved
# only at its start, 2 s) and its APS answers 404 after 6 s, i.e. at 8 s; the
# insertion (PRT 6 s, @duration 10 s, @earliestResolutionTimeOffset 0) is still
# active then. The base executes it late (§5.16.2.2.5, PRT <= PHP <= EAP): at
# PRTA = 8 s, returning to RT = PRTA. A Player that drops a missed event shows no
# break.
format: sgai-scenario/1
criterion: R40.3
criterion_sha256: c2acaccabd0e87cd2ec8edd81d09269d237a5eef727ff1efbf9ae3a42d542bfe
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 14000
entry: behaviour/fixtures/R40.3/r40-3-2-main.mpd
fixtures:
- {path: behaviour/fixtures/R40.3/r40-3-2-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R40.3/r40-3-2-alt.mpd, url: 'https://aps.example.com/b/r40-3-2/break', class: sps-mpd}
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
aps:
- {url: 'https://aps.example.com/b/r40-3-2/w', status: 404, delay: 6000}
outcomes:
  D1:
    summary: 'R40.3: "When a window that declares supersede presents no ad, the Player MUST execute the inherited linear events it stood
      in for under the base specification''s rules, including those for an execution that starts after an event''s presentation time."
      The window fails at 8 s; the insertion executes late at PRTA = 8 s.'
    requests:
    - at: 2000
      url: https://aps.example.com/b/r40-3-2/w
      query: {sgai-allowed-layouts: overlay-lower-third}
    - {at: 8000, url: 'https://aps.example.com/b/r40-3-2/break', answered_by: behaviour/fixtures/R40.3/r40-3-2-alt.mpd}
    selection:
    - opportunity: {fixture: behaviour/fixtures/R40.3/r40-3-2-main.mpd, event_id: '2'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R40.3/r40-3-2-alt.mpd, id: alt}
        option: null
        layout: linear
    presentation:
    - start: 0
      end: 8000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 8000
      end: 12000
      layout: linear
      shows:
      - element: ad
        candidate: *id001
        option: null
    - start: 12000
      end: 14000
      layout: none
      shows:
      - {element: primary, from: 8000}
    beacons:
    - {at: 8000, fixture: behaviour/fixtures/R40.3/r40-3-2-alt.mpd, id: '1', url: 'https://t.example.com/r40-3-2/imp'}
