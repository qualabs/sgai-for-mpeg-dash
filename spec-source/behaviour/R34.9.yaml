# R34.9 — "An execution that begins after the window's start MUST present
# the sequence of candidates (R7.1) from its first candidate when the window
# does not declare it ... In both cases the execution ends no later than the
# window does." An overlay window 10-30 s with two 10 s candidates, A and B
# (fixtures/R34.9/main.mpd, overlay-list.xml); playback starts at 15 s, a
# join inside the window.
# Only the "does not declare it" half is written: the overlay window has no
# carrier for the offset declaration in spec-source (@startWithOffset is
# not an attribute of svta:OverlayPresentation; see the evidence README,
# T-04/b). R34.9 is held by the Publisher; what is tested is what the
# Player does with a window that declares nothing.
format: sgai-scenario/1
criterion: R34.9
criterion_sha256: 96209e76c65213db51d2435e9bc22165ebf439342f8dbe46dcd5d48aefe837ac
timescale: 1000
tolerance: 250
play_from: 15000
observe_until: 17000
entry: behaviour/fixtures/R34.9/main.mpd
fixtures:
  - path: behaviour/fixtures/R34.9/main.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R34.9/overlay-list.xml
    url: https://aps.example.com/behaviour/r34-9?w=1
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D3: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []

outcomes:
  D1: &o
    summary: >-
      The late execution starts with A from its beginning, for its full 10 s
      (main 15-25 s), not 5 s into it; B follows and is cut at the window's
      end, main 30 s (session 15 s); then the film alone.
    requests:
      - {at: {from: 0, to: 250}, url: "https://aps.example.com/behaviour/r34-9?w=1", answered_by: behaviour/fixtures/R34.9/overlay-list.xml}
    selection:
      - opportunity: {fixture: behaviour/fixtures/R34.9/main.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &a {fixture: behaviour/fixtures/R34.9/overlay-list.xml, index: 1}, option: {index: 1}, layout: overlay-lower-third}
          - {candidate: &b {fixture: behaviour/fixtures/R34.9/overlay-list.xml, index: 2}, option: {index: 1}, layout: overlay-lower-third}
    presentation:
      - {start: 0, end: 10000, layout: overlay-lower-third, shows: [{element: primary, from: 15000}, {element: ad, candidate: *a, option: {index: 1}}]}
      - {start: 10000, end: 15000, layout: overlay-lower-third, shows: [{element: primary, from: 25000}, {element: ad, candidate: *b, option: {index: 1}}], note: "B cut at the window's end"}
      - {start: 15000, end: 17000, layout: none, shows: [{element: primary, from: 30000}]}
    beacons:
      - {at: 0, fixture: behaviour/fixtures/R34.9/overlay-list.xml, candidate: *a, id: "1", url: "https://t.example.com/imp?cr=349a"}
      - {at: 10000, fixture: behaviour/fixtures/R34.9/overlay-list.xml, candidate: *b, id: "1", url: "https://t.example.com/imp?cr=349b"}
  D3: *o
  D4: *o
