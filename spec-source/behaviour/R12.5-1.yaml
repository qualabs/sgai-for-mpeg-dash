# R12.5 — the squeezeback tokens and an overlay token, composed as each
# token denotes. One overlay window (2 s to 22 s of the programme) whose
# document holds five image candidates of 4 s, one per token, presented in
# sequence; the geometry is sampled in the middle of each.
#
# Geometry, from R12.5's table, read as AREA of the frame with the aspect
# ratio kept [inferred: the criterion says "the upper-left 60% of the frame"
# and "the centre-left 25% of the frame" without saying area or side]:
#   - an L-shape's primary content is 60% of the frame's area: each side
#     sqrt(0.60) = 77.46% of the viewport's, anchored at the named corner;
#   - a double box's boxes are 25% of the area each: 50% x 50%, side by side,
#     vertically centred (y 25%), which is the only placement of two such
#     boxes that is "centre-left" and "centre-right" in a 16:9 frame.
# The side reading (60% x 60%, 25% x 25%) would leave the double box's
# horizontal placement undetermined; the area reading determines every
# rectangle. The viewport is assumed 16:9, as the content.
# `squeezeback-frame` is not tested: the extension schema has no such token
# (sgai-extension.xsd LayoutTokenType), so no fixture can carry it.
format: sgai-scenario/1
criterion: R12.5
criterion_sha256: a6d320b9a5bf5ae07c1e23cbb907354b2b9839cc8f70b409499e1343f6087cdb
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 24000
entry: behaviour/fixtures/R12.5/main.mpd
fixtures:
  - path: behaviour/fixtures/R12.5/main.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R12.5/overlay.xml
    url: https://aps.example.com/beh/r12-5/overlay
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []

outcomes:
  D1:
    summary: >-
      Decides R12.5 "an option rendered with a token MUST be composed as the
      token denotes" for overlay ("composited over primary content that is
      not transformed") and the four squeezeback tokens ("the primary content
      is shrunk into the region the table below gives, and the ad occupies
      the rest of the frame as R26 and R27 state").
    requests:
      - at: {from: 0, to: 2000}
        url: https://aps.example.com/beh/r12-5/overlay
        answered_by: behaviour/fixtures/R12.5/overlay.xml
    selection:
      - opportunity: {fixture: behaviour/fixtures/R12.5/main.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &c1 {fixture: behaviour/fixtures/R12.5/overlay.xml, index: 1}, option: {index: 1}, layout: overlay}
          - {candidate: &c2 {fixture: behaviour/fixtures/R12.5/overlay.xml, index: 2}, option: {index: 1}, layout: squeezeback-l-shape-upper-left}
          - {candidate: &c3 {fixture: behaviour/fixtures/R12.5/overlay.xml, index: 3}, option: {index: 1}, layout: squeezeback-l-shape-upper-right}
          - {candidate: &c4 {fixture: behaviour/fixtures/R12.5/overlay.xml, index: 4}, option: {index: 1}, layout: squeezeback-double-box}
          - {candidate: &c5 {fixture: behaviour/fixtures/R12.5/overlay.xml, index: 5}, option: {index: 1}, layout: squeezeback-double-box-background}
    presentation:
      - {start: 0, end: 2000, layout: none, shows: [{element: primary, from: 0}]}
      - {start: 2000, end: 6000, layout: overlay, shows: [{element: primary, from: 2000}, {element: ad, candidate: *c1, option: {index: 1}}]}
      - {start: 6000, end: 10000, layout: squeezeback-l-shape-upper-left, shows: [{element: primary, from: 6000, region: upper-left 60%}, {element: ad, candidate: *c2, option: {index: 1}, region: "full frame, underneath"}]}
      - {start: 10000, end: 14000, layout: squeezeback-l-shape-upper-right, shows: [{element: primary, from: 10000, region: upper-right 60%}, {element: ad, candidate: *c3, option: {index: 1}, region: "full frame, underneath"}]}
      - {start: 14000, end: 18000, layout: squeezeback-double-box, shows: [{element: primary, from: 14000, region: centre-left 25%}, {element: ad, candidate: *c4, option: {index: 1}, region: centre-right 25%}], note: the uncovered bands black}
      - {start: 18000, end: 22000, layout: squeezeback-double-box-background, shows: [{element: background}, {element: primary, from: 18000, region: centre-left 25%}, {element: ad, candidate: *c5, option: {index: 1}, region: centre-right 25%}], note: the background image in the uncovered bands}
      - {start: 22000, end: 24000, layout: none, shows: [{element: primary, from: 22000}]}
    beacons: []
    geometry:
      # overlay: the primary content is not transformed.
      - {at: 4000, tolerance: 1, primary: {x: 0, y: 0, width: 100, height: 100}}
      # L-shape upper-left: primary in the upper-left 60%, the creative the whole frame (R27.1).
      - {at: 8000, tolerance: 1, primary: {x: 0, y: 0, width: 77.46, height: 77.46}, ad: {x: 0, y: 0, width: 100, height: 100}}
      # L-shape upper-right.
      - {at: 12000, tolerance: 1, primary: {x: 22.54, y: 0, width: 77.46, height: 77.46}, ad: {x: 0, y: 0, width: 100, height: 100}}
      # Double box: primary centre-left 25%, ad centre-right 25%.
      - {at: 16000, tolerance: 1, primary: {x: 0, y: 25, width: 50, height: 50}, ad: {x: 50, y: 25, width: 50, height: 50}}
      # Double box with background: the ad layer's bounding box includes the
      # background, which fills the bands (R26.1), so it is the whole frame.
      - {at: 20000, tolerance: 1, primary: {x: 0, y: 25, width: 50, height: 50}, ad: {x: 0, y: 0, width: 100, height: 100}}
