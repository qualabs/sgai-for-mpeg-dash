# R30.2 — an empty resolution is not an execution, so an @executeOnce="true" event
# stays executable. Loaded: an InsertPresentation at 2 s with @executeOnce="true"
# and @earliestResolutionTimeOffset 0; the APS answers its first request with the
# empty List MPD of §5.2.3 and its second with a 4 s alternative MPD. The viewer
# seeks back to 0 at 4 s, so PRT is traversed again at 6 s. A Player that counts
# the empty answer as the execution does not request again and shows no ad.
format: sgai-scenario/1
criterion: R30.2
criterion_sha256: d3516ac22ad57b77a3acc8d254f7968776d7ab0d60edf5a9155918f30799231c
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 12000
entry: behaviour/fixtures/R30.2/main.mpd
fixtures:
- {path: behaviour/fixtures/R30.2/main.mpd, class: publisher-mpd}
- {path: examples/chapter-5/5.2.3-1.mpd, url: 'https://aps.example.com/b/r30-2/break'}
- {path: behaviour/fixtures/R30.2/alt.mpd, url: 'https://aps.example.com/b/r30-2/break', class: sps-mpd}
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions:
- {at: 4000, do: seek, to: 0}
aps:
- {url: 'https://aps.example.com/b/r30-2/break', nth: 1, status: 200, document: examples/chapter-5/5.2.3-1.mpd}
- {url: 'https://aps.example.com/b/r30-2/break', nth: 2, status: 200, document: behaviour/fixtures/R30.2/alt.mpd}
outcomes:
  D1:
    summary: 'R30.2: "A resolution carrying no candidates MUST NOT count as an execution of the opportunity. Where the opportunity''s
      event carries `@executeOnce="true"`, the event remains executable afterwards" (§5.16.2.2.6 NOTE 3). First pass: empty, the primary
      content continues. After the seek: the alternative at 6 s, then the primary content from PRTA (2 s).'
    requests:
    - {at: 2000, url: 'https://aps.example.com/b/r30-2/break', answered_by: examples/chapter-5/5.2.3-1.mpd}
    - {at: 6000, url: 'https://aps.example.com/b/r30-2/break', answered_by: behaviour/fixtures/R30.2/alt.mpd}
    selection:
    - opportunity: {fixture: behaviour/fixtures/R30.2/main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R30.2/alt.mpd, id: alt}
        option: null
        layout: linear
    presentation:
    - start: 0
      end: 4000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 4000
      end: 6000
      layout: none
      shows:
      - {element: primary, from: 0}
      note: after the seek back to 0
    - start: 6000
      end: 10000
      layout: linear
      shows:
      - element: ad
        candidate: *id001
        option: null
    - start: 10000
      end: 12000
      layout: none
      shows:
      - {element: primary, from: 2000}
    beacons:
    - {at: 6000, fixture: behaviour/fixtures/R30.2/alt.mpd, id: '1', url: 'https://t.example.com/r30-2/imp'}
