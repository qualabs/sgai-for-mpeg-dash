# R17.1 — paused inside a pause window while an overlay is active: the pause
# ad is rendered and the overlay is suspended. An overlay window 2 s to 12 s
# with one 10 s image lower-third, inside a pause window over the first
# minute; the viewer pauses at 5 s (3 s into the overlay) and resumes at 8 s.
# The pause ad is PARTIAL, so the paused frame stays visible and a Player
# that left the overlay on screen would be seen doing it.
format: sgai-scenario/1
criterion: R17.1
criterion_sha256: b1b588ae7af0f5e4503c6df4a2640eb9634d4c4317c46a9c8d48ae76936f6a71
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 17000
entry: behaviour/fixtures/R17.1/main.mpd
fixtures:
  - path: behaviour/fixtures/R17.1/main.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R17.1/overlay.xml
    url: https://aps.example.com/beh/r17-1/overlay
    class: overlay-list
  - path: behaviour/fixtures/R17.1/pause.xml
    url: https://aps.example.com/beh/r17-1/pause
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions:
  - {at: 5000, do: pause}
  - {at: 8000, do: resume}

outcomes:
  D1:
    summary: >-
      Decides R17.1 "the Player MUST render the pause-ad form and MUST suspend
      the overlay rendering": from 5 s to 8 s the paused frame and the pause
      ad are on screen and the lower-third is not; the overlay's slot timeline
      stands still, so its 5 s beacon fires at 10 s and not at 7 s.
    requests:
      - at: {from: 0, to: 2000}
        url: https://aps.example.com/beh/r17-1/overlay
        answered_by: behaviour/fixtures/R17.1/overlay.xml
      - at: {from: 0, to: 5000}
        url: https://aps.example.com/beh/r17-1/pause
        answered_by: behaviour/fixtures/R17.1/pause.xml
    selection:
      - opportunity: {fixture: behaviour/fixtures/R17.1/main.mpd, event_id: "1"}
        result: presented
        presented:
          - {candidate: &o {fixture: behaviour/fixtures/R17.1/overlay.xml, index: 1}, option: {index: 1}, layout: overlay-lower-third}
      - opportunity: {fixture: behaviour/fixtures/R17.1/main.mpd, event_id: "2"}
        result: presented
        presented:
          - {candidate: &p {fixture: behaviour/fixtures/R17.1/pause.xml, index: 1}, option: {index: 1}, layout: pause-partial}
    presentation:
      - {start: 0, end: 2000, layout: none, shows: [{element: primary, from: 0}]}
      - {start: 2000, end: 5000, layout: overlay-lower-third, shows: [{element: primary, from: 2000}, {element: ad, candidate: *o, option: {index: 1}}]}
      - {start: 5000, end: 8000, layout: pause-partial, shows: [{element: primary, from: 5000}, {element: ad, candidate: *p, option: {index: 1}}], note: "the lower-third suspended, not on screen"}
      # R17.2's restoration; written so the presentation tiles the observation.
      - {start: 8000, end: 15000, layout: overlay-lower-third, shows: [{element: primary, from: 5000}, {element: ad, candidate: *o, option: {index: 1}}], note: the remaining 7 s of the lower-third}
      - {start: 15000, end: 17000, layout: none, shows: [{element: primary, from: 12000}]}
    beacons:
      - {at: 2000, fixture: behaviour/fixtures/R17.1/overlay.xml, candidate: *o, id: "1", url: "https://t.example.com/r17-1/ov-imp"}
      - {at: 10000, fixture: behaviour/fixtures/R17.1/overlay.xml, candidate: *o, id: "2", url: "https://t.example.com/r17-1/ov-mid"}
      - {at: 15000, fixture: behaviour/fixtures/R17.1/overlay.xml, candidate: *o, id: "3", url: "https://t.example.com/r17-1/ov-complete"}
