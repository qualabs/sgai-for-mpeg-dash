# R39.5 — "A custom option whose rectangle does not lie inside the slot's
# region ... MUST NOT be rendered ... and the Player moves to the next option
# (R5.6). A Player that does not support custom treats every custom option
# as not renderable." The window admits `custom` inside the region
# "50 50 50 50", the lower-right quarter (fixtures/R39.5/main-region.mpd).
# One candidate (fixtures/R39.5/region.xml): option 1 custom "45 60 20 20",
# whose left edge is 5 points outside the region; option 2 custom
# "60 60 40 40", whose right and bottom edges lie exactly on the region's
# (60 + 40 = 50 + 50: inside, by §5.3.5's x + w <= rx + rw); option 3
# overlay-corner. D1 supports custom, D4 does not.
format: sgai-scenario/1
criterion: R39.5
criterion_sha256: e290784549992264b7d855a21de190291b103d8ad00f9674ac9052faebe0650f
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 12000
entry: behaviour/fixtures/R39.5/main-region.mpd
fixtures:
  - path: behaviour/fixtures/R39.5/main-region.mpd
    class: publisher-mpd
  - path: behaviour/fixtures/R39.5/region.xml
    url: https://aps.example.com/behaviour/r39-5?w=1
    class: overlay-list
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 1, sgai-ad-audio: 0}
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []

outcomes:
  D1:
    summary: >-
      Option 1 (partly outside the region) is not rendered; option 2, on the
      region's edge, is shown 5-10 s at its rectangle, x 60 %, y 60 %,
      40 % x 40 %.
    requests:
      - &resolve {at: {from: 0, to: 5000}, url: "https://aps.example.com/behaviour/r39-5?w=1", query: {sgai-allowed-layouts: custom overlay-corner, sgai-custom-region: 50 50 50 50}, answered_by: behaviour/fixtures/R39.5/region.xml}
    selection:
      - opportunity: &opp {fixture: behaviour/fixtures/R39.5/main-region.mpd, event_id: "1"}
        result: presented
        presented: [{candidate: &c {fixture: behaviour/fixtures/R39.5/region.xml, index: 1}, option: {index: 2}, layout: custom}]
    presentation:
      - &before {start: 0, end: 5000, layout: none, shows: [{element: primary, from: 0}]}
      - {start: 5000, end: 10000, layout: custom, shows: [{element: primary, from: 5000}, {element: ad, candidate: *c, option: {index: 2}}]}
      - &after {start: 10000, end: 12000, layout: none, shows: [{element: primary, from: 10000}]}
    beacons: &imp
      - {at: 5000, fixture: behaviour/fixtures/R39.5/region.xml, candidate: *c, id: "1", url: "https://t.example.com/imp?cr=395"}
    geometry:
      - {at: 7500, ad: {x: 60, y: 60, width: 40, height: 40}, tolerance: 1}
  D4:
    summary: >-
      No custom support: options 1 and 2 are both not renderable, and option
      3 (overlay-corner) is shown 5-10 s.
    requests: [*resolve]
    selection:
      - opportunity: *opp
        result: presented
        presented: [{candidate: *c, option: {index: 3}, layout: overlay-corner}]
    presentation:
      - *before
      - {start: 5000, end: 10000, layout: overlay-corner, shows: [{element: primary, from: 5000}, {element: ad, candidate: *c, option: {index: 3}}]}
      - *after
    beacons: *imp
