# R20.3, the tie-break: two overlay windows with the same @presentationTime, in
# one EventStream; each APS answers one 5 s image. A Player that takes the last
# one, or any other order, shows window 2's image and requests window 2.
format: sgai-scenario/1
criterion: R20.3
criterion_sha256: be9de53fee730ca5889a9f80e7955cafec6fcf80eb308477466564f215e5157d
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 9000
entry: behaviour/fixtures/R20.3/r20-3-1-main.mpd
fixtures:
- {path: behaviour/fixtures/R20.3/r20-3-1-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R20.3/r20-3-1-w1.xml, url: 'https://aps.example.com/b/r20-3-1/w1', class: overlay-list}
- {path: behaviour/fixtures/R20.3/r20-3-1-w2.xml, url: 'https://aps.example.com/b/r20-3-1/w2', class: overlay-list}
player_capabilities:
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
outcomes:
  D4:
    summary: 'R20.3: "Where two windows carry the same presentation time, the Player MUST take them in the order in which they appear
      inside the `EventStream`." Window 1 succeeds, so window 2 is never attempted.'
    requests:
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r20-3-1/w1
      query: {sgai-allowed-layouts: overlay-lower-third}
      answered_by: behaviour/fixtures/R20.3/r20-3-1-w1.xml
    selection:
    - opportunity: {fixture: behaviour/fixtures/R20.3/r20-3-1-main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R20.3/r20-3-1-w1.xml, index: 1}
        option: {index: 1}
        layout: overlay-lower-third
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 7000
      layout: overlay-lower-third
      shows:
      - {element: primary, from: 2000}
      - element: ad
        candidate: *id001
        option: {index: 1}
    - start: 7000
      end: 9000
      layout: none
      shows:
      - {element: primary, from: 7000}
    beacons:
    - at: 2000
      fixture: behaviour/fixtures/R20.3/r20-3-1-w1.xml
      candidate: *id001
      id: '1'
      url: https://t.example.com/r20-3-1/first-imp
