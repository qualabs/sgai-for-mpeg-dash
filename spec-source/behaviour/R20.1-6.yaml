# R20.1: every window of the chain fails. Loaded: overlay windows 1 and 2 over the
# same span; window 1 answers 404, window 2 an <svta:OverlayList> with no
# candidate. A Player that stalls or shows a placeholder fails.
format: sgai-scenario/1
criterion: R20.1
criterion_sha256: 620e75eecd8499c6e4fa555f51deed1ac20f485cf73a5e4b8805e5ab1519f615
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 9000
entry: behaviour/fixtures/R20.1/r20-1-6-main.mpd
fixtures:
- {path: behaviour/fixtures/R20.1/r20-1-6-main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R20.1/r20-1-6-w2.xml, url: 'https://aps.example.com/b/r20-1-6/w2', class: overlay-list}
player_capabilities:
  D4: {sgai-video-decoders: 1, sgai-image-over-video: 1, sgai-html-over-video: 0, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
aps:
- {url: 'https://aps.example.com/b/r20-1-6/w1', status: 404}
outcomes:
  D4:
    summary: 'R20.1: "When every overlapping window of the family has been attempted and none produced an ad, the Player MUST continue
      with the primary content uninterrupted". Window 1 fails (404), window 2 is declined (no candidates): the primary content throughout.'
    requests:
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r20-1-6/w1
      query: {sgai-allowed-layouts: overlay-lower-third}
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r20-1-6/w2
      query: {sgai-allowed-layouts: overlay-lower-third}
      answered_by: behaviour/fixtures/R20.1/r20-1-6-w2.xml
    selection:
    - opportunity: {fixture: behaviour/fixtures/R20.1/r20-1-6-main.mpd, event_id: '2'}
      result: declined
      presented: []
    presentation:
    - start: 0
      end: 9000
      layout: none
      shows:
      - {element: primary, from: 0}
    beacons: []
