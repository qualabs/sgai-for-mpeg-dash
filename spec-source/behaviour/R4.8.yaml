# R4.8 — an inherited linear event with no @maxDuration is executed with the base
# answer: the cap is infinity, and the main presentation resumes only when the
# alternative presentation terminates. Loaded: an InsertPresentation at 2 s with no
# @maxDuration, answered by an 8 s single-period alternative MPD (a blackout is
# written this way). A Player that requires a cap here refuses it and shows the
# programme; one that applies a default cap cuts it short.
format: sgai-scenario/1
criterion: R4.8
criterion_sha256: 82d30e81ae27529b4d739b8957b8d77d9e2f90dcbc7903ddafba647d1d26a587
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 12000
entry: behaviour/fixtures/R4.8/main.mpd
fixtures:
- {path: behaviour/fixtures/R4.8/main.mpd, class: publisher-mpd}
- {path: behaviour/fixtures/R4.8/alt.mpd, url: 'https://aps.example.com/b/r4-8/break', class: sps-mpd}
player_capabilities:
  D1: {sgai-video-decoders: 2, sgai-image-over-video: 1, sgai-html-over-video: 1, sgai-custom-layout: 0, sgai-ad-audio: 0}
sends_capabilities: []
actions: []
outcomes:
  D1:
    summary: 'R4.8: an absent `@maxDuration` *"is assumed to be infinity, in which case the current presentation resumes only when the
      alternative presentation terminates"* (§5.16.5). The alternative for its whole 8 s, then the primary content from PRTA (2 s).'
    requests:
    - at: {from: 0, to: 2000}
      url: https://aps.example.com/b/r4-8/break
      answered_by: behaviour/fixtures/R4.8/alt.mpd
    selection:
    - opportunity: {fixture: behaviour/fixtures/R4.8/main.mpd, event_id: '1'}
      result: presented
      presented:
      - candidate: &id001 {fixture: behaviour/fixtures/R4.8/alt.mpd, id: alt}
        option: null
        layout: linear
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - {element: primary, from: 0}
    - start: 2000
      end: 10000
      layout: linear
      shows:
      - element: ad
        candidate: *id001
        option: null
    - start: 10000
      end: 12000
      layout: none
      shows:
      - {element: primary, from: 2000}
    beacons:
    - {at: 2000, fixture: behaviour/fixtures/R4.8/alt.mpd, id: '1', url: 'https://t.example.com/r4-8/start'}
    - {at: 10000, fixture: behaviour/fixtures/R4.8/alt.mpd, id: '2', url: 'https://t.example.com/r4-8/end'}
