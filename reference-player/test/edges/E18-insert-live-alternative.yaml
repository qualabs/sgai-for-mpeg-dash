# A live alternative (MPD@type "dynamic") "always starts at the live edge" (§5.16.2.2.6), and
# its APD, the duration its MPD defines, is infinite: the MPD declares no end. Its playhead is
# counted from where it started, not from its availabilityStartTime.
# Insertion at PRT 2 s, APDmax 4 s: APDA = min(APD, APDmax) = min(inf, 4) = 4; RT = PRTA = 2.
format: sgai-scenario/1
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 9000
entry: fixtures/ins-live-max-main.mpd
fixtures:
- path: fixtures/ins-live-max-main.mpd
- path: fixtures/live.mpd
  url: https://aps.example.com/t05/live
player_capabilities:
  D1:
    sgai-video-decoders: 2
    sgai-image-over-video: 1
    sgai-html-over-video: 1
    sgai-custom-layout: 0
    sgai-ad-audio: 0
sends_capabilities: []
actions: []
outcomes:
  D1:
    summary: the programme, the live alternative 2-6 s, then the programme from 2 s
    requests:
    - at:
        from: 0
        to: 2000
      url: https://aps.example.com/t05/live
      answered_by: fixtures/live.mpd
    selection:
    - opportunity:
        fixture: fixtures/ins-live-max-main.mpd
        event_id: '1'
      result: presented
      presented:
      - candidate:
          fixture: fixtures/live.mpd
          id: live
        option: null
        layout: linear
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - element: primary
        from: 0
    - start: 2000
      end: 6000
      layout: linear
      shows:
      - element: ad
        candidate:
          fixture: fixtures/live.mpd
          id: live
        option: null
    - start: 6000
      end: 9000
      layout: none
      shows:
      - element: primary
        from: 2000
    beacons: []
