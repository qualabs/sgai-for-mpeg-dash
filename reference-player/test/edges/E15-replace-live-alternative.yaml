# A live alternative (MPD@type "dynamic") "always starts at the live edge" (§5.16.2.2.6), and
# its APD, the duration its MPD defines, is infinite: the MPD declares no end. Its playhead is
# counted from where it started, not from its availabilityStartTime.
# Replacement at PRT 2 s, APDmax 6 s, @clip absent, executed on time (PRTA = PRT + d): APDadj =
# 6 - d, APDA = min(inf - 0, 6 - d) = 6 - d, RT = PRT + APDA = 8 - d. The live alternative ends
# 6 s after it started, though its own timeline is months past its start.
format: sgai-scenario/1
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 10000
entry: fixtures/rep-live-max-main.mpd
fixtures:
- path: fixtures/rep-live-max-main.mpd
- path: fixtures/live.mpd
  url: https://aps.example.com/t05/live
player_capabilities:
  D1:
    sgai-video-decoders: 2
    sgai-image-over-video: 1
    sgai-html-over-video: 1
    sgai-custom-layout: 0
    sgai-ad-audio: 0
sends_capabilities: []
actions: []
outcomes:
  D1:
    summary: the programme, the live alternative 2-8 s, then the programme from 8 s
    requests:
    - at:
        from: 0
        to: 2000
      url: https://aps.example.com/t05/live
      answered_by: fixtures/live.mpd
    selection:
    - opportunity:
        fixture: fixtures/rep-live-max-main.mpd
        event_id: '1'
      result: presented
      presented:
      - candidate:
          fixture: fixtures/live.mpd
          id: live
        option: null
        layout: linear
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - element: primary
        from: 0
    - start: 2000
      end: 8000
      layout: linear
      shows:
      - element: ad
        candidate:
          fixture: fixtures/live.mpd
          id: live
        option: null
    - start: 8000
      end: 10000
      layout: none
      shows:
      - element: primary
        from: 8000
    beacons: []
