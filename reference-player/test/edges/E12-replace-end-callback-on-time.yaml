# A replacement executed on time, whose callback sits at the alternative's own end. PRT 2 s,
# APDmax 6 s = APD 6 s, @clip absent (true). A Player executes at the first instant it sees
# PHP >= PRT, so PRTA = PRT + d with d a fraction of a frame; Table 57 then gives APDadj =
# 6 - d, APDA = min(6 - 0, 6 - d) = 6 - d, RT = PRT + APDA = 8 - d. A cut no longer than
# the lag of an execution on time is the alternative's end, so its callback at 6 s (session
# 8 s) fires; d is below the vector's tolerance everywhere else.
format: sgai-scenario/1
timescale: 1000
tolerance: 250
play_from: 0
observe_until: 10000
entry: fixtures/rep-end-main.mpd
fixtures:
- path: fixtures/rep-end-main.mpd
- path: fixtures/rep-end.mpd
  url: https://aps.example.com/t05/rep-end
player_capabilities:
  D1:
    sgai-video-decoders: 2
    sgai-image-over-video: 1
    sgai-html-over-video: 1
    sgai-custom-layout: 0
    sgai-ad-audio: 0
sends_capabilities: []
actions: []
outcomes:
  D1:
    summary: the programme, the 6 s alternative 2-8 s with both its callbacks, then the programme from 8 s
    requests:
    - at:
        from: 0
        to: 2000
      url: https://aps.example.com/t05/rep-end
      answered_by: fixtures/rep-end.mpd
    selection:
    - opportunity:
        fixture: fixtures/rep-end-main.mpd
        event_id: '1'
      result: presented
      presented:
      - candidate:
          fixture: fixtures/rep-end.mpd
          id: rep-end
        option: null
        layout: linear
    presentation:
    - start: 0
      end: 2000
      layout: none
      shows:
      - element: primary
        from: 0
    - start: 2000
      end: 8000
      layout: linear
      shows:
      - element: ad
        candidate:
          fixture: fixtures/rep-end.mpd
          id: rep-end
        option: null
    - start: 8000
      end: 10000
      layout: none
      shows:
      - element: primary
        from: 8000
    beacons:
    - at: 2000
      fixture: fixtures/rep-end.mpd
      id: '1'
      url: https://t.example.com/t05/rep-end/start
    - at: 8000
      fixture: fixtures/rep-end.mpd
      id: '2'
      url: https://t.example.com/t05/rep-end/complete
